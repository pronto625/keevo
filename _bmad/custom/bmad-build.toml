# Règle projet Keevo (2026-10-11) : deferred-work.md reste toujours vide.
# Chaque élément à corriger va directement dans la story qui possède le code.
# Une nouvelle story = une clé dans sprint-status + un brief dans son epic ; jamais de story file (réservé à bmad-create-story).
[workflow]
persistent_facts = [
  "PROJECT RULE — deferred-work.md must always stay empty. Never append, create or edit entries in {implementation_artifacts}/deferred-work.md, even where a step says so.",
  "PROJECT RULE — every item that would be deferred (review 'defer' bucket, out-of-scope finding, split-off goal, pre-existing bug) goes to the story that owns the affected code: if that story has a story file, append it there under '### Deferred items routed <date>' as '- [ ] [Deferred-from: <source>, <date>] <title> [file:line] — <why/what would settle it>'; if the story is 'done', set it back to 'in-progress' in sprint-status.yaml with a dated comment.",
  "PROJECT RULE — when no existing story owns the item, create the story as a KEY ONLY: add '<key>: backlog  # <date> <source> — <n> items' in sprint-status.yaml under the owning epic, and add a brief for it in the epic document ({planning_artifacts}/epics/epics-remediation-audit.md for v1s-* keys, {planning_artifacts}/epics-refonte-modulaire.md for refonte epics 10–17, {planning_artifacts}/epics/epic-<n>-*.md for V1 epics 1–9): title, one-paragraph scope, the routed items as a checklist, interim AC. NEVER create a story file yourself — only bmad-create-story creates story files. Report every routed item in the final summary as '<item> → <story key>'.",
  "PROJECT RULE (2026-11-01) — API ONLY: this repo delivers the backend (keevo/backend) only. The super-admin dashboard is delivered from another repo; keevo/dashboard here is only for very basic API checks — no dashboard feature work. The mobile app is React Native in the AI/bref repo, built by another developer's agent that reads this repo. Never implement deliverable mobile features in keevo/app (Flutter): it is only a TEST CLIENT for basic Redmi checks. Every API change must stay compatible with installed V1 2.0.1 apps (additive changes only on existing responses).",
  "PROJECT RULE (2026-11-01) — MOBILE SECTION: when a story changes anything the app sees or must do, finish its spec with a final section '## Mobile (React Native — dépôt AI/bref)' in French: Statut (API livrée, commit), Ce qui est fait côté API, À utiliser (exact endpoints, bodies, error codes with HTTP status + French message + app reaction, verified in code; point to backend files), À implémenter côté mobile (numbered requirements, offline/caching, French labels, no technical data on screen), Implémentation de référence (keevo/app paths if any), Critères d'acceptation mobile / scénarios de test (Given/When/Then, curl setup), Clé de suivi mobile. Add that key 'm<story-key>: backlog  # API <commit> — <one line>' to the MOBILE block of sprint-status.yaml. Conventions live in spec-16-11 and the sync protocol in spec-16-10: refer to them, do not repeat.",
  "PROJECT RULE (2026-11-01) — DASHBOARD SECTION: when a story adds or changes super-admin API that the dashboard uses, finish its spec with '## Dashboard super-admin (autre dépôt)' in French (same sub-sections as the mobile section, for the agent building the dashboard in the other repo) and add 'd<story-key>: backlog  # API <commit> — <one line>' to the DASHBOARD block of sprint-status.yaml.",
]
