name: Deploy Backend

# ─── Trigger ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - deploy

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─── Job 1 : Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image ref
        id: image
        run: |
          IMAGE_LC=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_LC}"        >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_LC}:latest"  >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./keevo/backend
          file: ./keevo/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2 : Deploy stack (backend + postgres) on production server ──────────
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          envs: GHCR_PAT,GH_ACTOR,IMAGE_REF,APP_DOMAIN,ACME_EMAIL,JWT_PRIVATE_KEY_PEM,JWT_PUBLIC_KEY_PEM

          # ── Script that runs on the remote server ──────────────────────────────
          # Prerequisites on server:
          #   • Docker + Docker Compose plugin installed
          #   • ~/keevo/.env  (copy backend/.env.example, fill prod values;
          #     POSTGRES_HOST will be overridden by compose to "postgres")
          #   • ~/keevo/firebase-credentials.json  (Firebase service-account key)
          #   • JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM secrets (RSA 2048 PEM content)
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/keevo"

            mkdir -p "${DEPLOY_DIR}/keys"
            cd "${DEPLOY_DIR}"

            echo "→ Writing RSA key pair for JWT…"
            printf '%s\n' "${JWT_PRIVATE_KEY_PEM}" > keys/private_key.pem
            printf '%s\n' "${JWT_PUBLIC_KEY_PEM}"  > keys/public_key.pem

            # The non-root `keevo` container (USER keevo, UID/GID 2001 per Dockerfile) must read
            # the private key, but the SSH deploy user is a non-root sudoer that CANNOT `chown`
            # to a different UID (no CAP_CHOWN). Strategy: keep the deploy user as OWNER (so
            # re-deploys can truncate the file) and let the container read via GROUP — `chgrp 2001`
            # + `chmod 640`. The deploy user must be a member of group GID 2001 on the host
            # (chgrp to a group you don't belong to requires root). Do NOT revert to `644`
            # (commit 708fa3e) — the public key alone may be world-readable, not the private one.
            #
            # One-time host prerequisite (run once as root on the prod host):
            #   sudo groupadd -g 2001 keevo-jwt && sudo usermod -aG keevo-jwt "${USER:-$(id -un)}"
            # NOTE: assumes the Docker daemon is NOT configured with user-namespace remapping
            # (userns-remap). With userns-remap, host GID 2001 maps to a different in-container
            # GID and the container would NOT be in this group → boot fails on key read.
            chgrp 2001 keys
            chmod 750 keys
            chgrp 2001 keys/private_key.pem keys/public_key.pem
            chmod 640 keys/private_key.pem
            chmod 644 keys/public_key.pem

            # Pre-flight assertions (AC2) — fail the deploy BEFORE `docker compose up`.
            # 1. Deploy user must be in group 2001, else chgrp above failed or no-op'd.
            case " $(id -G) " in
              *" 2001 "*) ;;
              *) echo "❌ deploy user is not in group 2001 (keevo-jwt) — run the host prerequisite (see comment above)" >&2; exit 1 ;;
            esac
            # 2. GID 2001 must be the keevo-jwt group (not a colliding host service account).
            test "$(getent group 2001 | cut -d: -f1)" = "keevo-jwt" || {
              echo "❌ GID 2001 is not 'keevo-jwt' on this host (collision?) — got: $(getent group 2001)" >&2; exit 1
            }
            # 3. Private key must NOT be world-readable (mode 640, no others-read).
            test "$(stat -c %a keys/private_key.pem)" = "640" || {
              echo "❌ private_key.pem must be mode 640 (got $(stat -c %a keys/private_key.pem))" >&2; exit 1
            }
            # 4. (defense-in-depth) The container UID/GID 2001 can actually read the key.
            docker run --rm -v "${DEPLOY_DIR}/keys:/keys:ro" --user 2001:2001 alpine \
              sh -c 'test -r /keys/private_key.pem' || {
                echo "❌ container UID 2001 cannot read keys/private_key.pem — check group/dir perms" >&2; exit 1
              }
            echo "✓ private_key.pem mode 640, group=keevo-jwt(2001), container-readable OK"

            echo "→ Authenticating with GHCR…"
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # ── Detect whether port 80 is already taken (external Traefik) ──────
            PORT80_FREE=false
            if ! ss -tlnp 2>/dev/null | grep -q ':80 ' && \
               ! docker ps --filter "publish=80" --format '{{.Names}}' 2>/dev/null | grep -q .; then
              PORT80_FREE=true
            fi

            if ${PORT80_FREE}; then
              echo "→ Port 80 free — deploying full stack (traefik + postgres + backend)"
              TRAEFIK_ENABLED=true
            else
              echo "→ Port 80 already in use (external Traefik detected) — deploying postgres + backend only"
              TRAEFIK_ENABLED=false
            fi

            # ── Traefik dynamic config (only if we manage Traefik) ──────────────
            if ${TRAEFIK_ENABLED}; then
              echo "→ Writing traefik/dynamic.yml…"
              mkdir -p traefik
              cat > traefik/dynamic.yml << DYNAMIC
            http:
              routers:
                backend:
                  rule: "Host(\`${APP_DOMAIN}\`)"
                  entryPoints:
                    - websecure
                  tls:
                    certResolver: letsencrypt
                  service: backend

              services:
                backend:
                  loadBalancer:
                    servers:
                      - url: "http://backend:4500"
                    healthCheck:
                      path: /actuator/health
                      interval: 10s
                      timeout: 5s
            DYNAMIC
            fi

            # ── Docker Compose ─────────────────────────────────────────────────
            echo "→ Writing docker-compose.prod.yml…"
            if ${TRAEFIK_ENABLED}; then
              # --- Full stack: traefik + postgres + backend ---
              cat > docker-compose.prod.yml << COMPOSE
            services:

              traefik:
                image: traefik:v3.3
                container_name: keevo_traefik
                restart: unless-stopped
                mem_limit: 128m
                mem_reservation: 64m
                command:
                  - --providers.file.filename=/etc/traefik/dynamic.yml
                  - --providers.file.watch=true
                  - --entrypoints.web.address=:80
                  - --entrypoints.websecure.address=:443
                  - --entrypoints.web.http.redirections.entryPoint.to=websecure
                  - --entrypoints.web.http.redirections.entryPoint.scheme=https
                  - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
                  - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
                  - --certificatesresolvers.letsencrypt.acme.email=\${ACME_EMAIL}
                  - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
                  - traefik_letsencrypt:/letsencrypt
                networks:
                  - keevo_net

              postgres:
                image: postgres:16-alpine
                container_name: keevo_postgres
                restart: unless-stopped
                mem_limit: 384m
                mem_reservation: 256m
                command:
                  - postgres
                  - -c
                  - shared_buffers=64MB
                  - -c
                  - work_mem=4MB
                  - -c
                  - maintenance_work_mem=32MB
                  - -c
                  - max_connections=30
                  - -c
                  - effective_cache_size=256MB
                environment:
                  POSTGRES_DB:       \${POSTGRES_DB}
                  POSTGRES_USER:     \${POSTGRES_USER}
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                networks:
                  - keevo_net

              backend:
                image: \${BACKEND_IMAGE}
                container_name: keevo_backend
                restart: unless-stopped
                mem_limit: 768m
                mem_reservation: 512m
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file: .env
                environment:
                  POSTGRES_HOST: postgres
                  POSTGRES_PORT: "5432"
                  SPRING_PROFILES_ACTIVE: prod
                  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
                  KEEVO_JWT_PRIVATE_KEY_PATH: file:/run/secrets/jwt/private_key.pem
                  KEEVO_JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt/public_key.pem
                volumes:
                  - ./firebase-credentials.json:/run/secrets/firebase:ro
                  - ./keys:/run/secrets/jwt:ro
                networks:
                  - keevo_net

            volumes:
              postgres_data:
              traefik_letsencrypt:

            networks:
              keevo_net:
                driver: bridge
            COMPOSE
            else
              # --- Light stack: postgres + backend only (external Traefik) ---
              cat > docker-compose.prod.yml << COMPOSE
            services:

              postgres:
                image: postgres:16-alpine
                container_name: keevo_postgres
                restart: unless-stopped
                mem_limit: 384m
                mem_reservation: 256m
                command:
                  - postgres
                  - -c
                  - shared_buffers=64MB
                  - -c
                  - work_mem=4MB
                  - -c
                  - maintenance_work_mem=32MB
                  - -c
                  - max_connections=30
                  - -c
                  - effective_cache_size=256MB
                environment:
                  POSTGRES_DB:       \${POSTGRES_DB}
                  POSTGRES_USER:     \${POSTGRES_USER}
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                networks:
                  - keevo_net

              backend:
                image: \${BACKEND_IMAGE}
                container_name: keevo_backend
                restart: unless-stopped
                mem_limit: 768m
                mem_reservation: 512m
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file: .env
                environment:
                  POSTGRES_HOST: postgres
                  POSTGRES_PORT: "5432"
                  SPRING_PROFILES_ACTIVE: prod
                  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
                  KEEVO_JWT_PRIVATE_KEY_PATH: file:/run/secrets/jwt/private_key.pem
                  KEEVO_JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt/public_key.pem
                volumes:
                  - ./firebase-credentials.json:/run/secrets/firebase:ro
                  - ./keys:/run/secrets/jwt:ro
                networks:
                  - keevo_net

            volumes:
              postgres_data:

            networks:
              keevo_net:
                driver: bridge
            COMPOSE
            fi

            # ── Deploy ─────────────────────────────────────────────────────────
            echo "→ Stopping old stack…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
            docker rm -f keevo_backend keevo_postgres 2>/dev/null || true
            if ${TRAEFIK_ENABLED}; then
              docker rm -f keevo_traefik 2>/dev/null || true
            fi

            echo "→ Pulling new backend image…"
            if ${TRAEFIK_ENABLED}; then
              BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml pull backend traefik
            else
              BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml pull backend
            fi

            echo "→ Starting / updating stack…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "→ Pruning dangling images…"
            docker image prune -f

            echo "✓ Deploy complete."
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml ps

      # Checkout so the committed backup scripts/units can be copied as-is
      # (single source of truth — no inline duplication that drifts).
      - name: Checkout (backup scripts)
        uses: actions/checkout@v4

      - name: Copy backup scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          source: "keevo/backend/scripts/backup-db.sh,keevo/backend/scripts/keevo-backup.service,keevo/backend/scripts/keevo-backup.timer"
          target: "keevo/scripts"
          strip_components: 3

      - name: Install systemd backup timer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/keevo"
            chmod +x "${DEPLOY_DIR}/scripts/backup-db.sh"

            # Install the committed systemd units (single source of truth).
            sudo cp "${DEPLOY_DIR}/scripts/keevo-backup.service" /etc/systemd/system/
            sudo cp "${DEPLOY_DIR}/scripts/keevo-backup.timer" /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable keevo-backup.timer
            sudo systemctl start keevo-backup.timer

            echo "✓ Backup timer installed (from committed scripts)."
            systemctl status keevo-backup.timer --no-pager || true

# ─── Required GitHub Secrets ──────────────────────────────────────────────────
# GHCR_PAT                — GitHub PAT, scope: read:packages
# DEPLOY_SSH_HOST         — server IP / hostname  (44.223.221.74)
# DEPLOY_SSH_USER         — SSH user
# DEPLOY_SSH_PRIVATE_KEY  — full SSH private key (ed25519 recommended)
# DEPLOY_SSH_PORT         — optional, defaults to 22
# APP_DOMAIN              — public FQDN served by Traefik, e.g. keevo.example.com
#
# Files required on the server under ~/keevo/ :
#   .env                          → backend/.env.example filled with prod values
#                                    (POSTGRES_HOST is overridden by compose → "postgres")
#                                    + ACME_EMAIL=your@email.com  (for Let's Encrypt)
#   firebase-credentials.json     → Firebase service-account key
#   .env.backup                   → backup env vars (mode 600):
#                                    POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#                                    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
#                                    BACKUP_S3_BUCKET, BACKUP_S3_PREFIX
#                                    (see docs/DEPLOYMENT_CHECKLIST.md § Sauvegardes)
