name: Deploy Backend

# ─── Trigger ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - deploy

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─── Job 1 : Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image ref
        id: image
        run: |
          IMAGE_LC=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_LC}"        >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_LC}:latest"  >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./keevo/backend
          file: ./keevo/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2 : Deploy stack (backend + postgres) on production server ──────────
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          envs: GHCR_PAT,GH_ACTOR,IMAGE_REF,APP_DOMAIN,JWT_PRIVATE_KEY_PEM,JWT_PUBLIC_KEY_PEM

          # ── Script that runs on the remote server ──────────────────────────────
          # Prerequisites on server:
          #   • Docker + Docker Compose plugin installed
          #   • ~/keevo/.env  (copy backend/.env.example, fill prod values;
          #     POSTGRES_HOST will be overridden by compose to "postgres")
          #   • ~/keevo/firebase-credentials.json  (Firebase service-account key)
          #   • JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM secrets (RSA 2048 PEM content)
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/keevo"

            mkdir -p "${DEPLOY_DIR}/keys"
            cd "${DEPLOY_DIR}"

            echo "→ Writing RSA key pair for JWT…"
            printf '%s\n' "${JWT_PRIVATE_KEY_PEM}" > keys/private_key.pem
            printf '%s\n' "${JWT_PUBLIC_KEY_PEM}"  > keys/public_key.pem
            chmod 644 keys/private_key.pem keys/public_key.pem

            echo "→ Authenticating with GHCR…"
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "→ Writing docker-compose.prod.yml…"
            cat > docker-compose.prod.yml << COMPOSE
            services:

              traefik:
                image: traefik:v3.3
                container_name: keevo_traefik
                restart: unless-stopped
                mem_limit: 128m
                mem_reservation: 64m
                command:
                  - --providers.docker=true
                  - --providers.docker.exposedByDefault=false
                  - --entrypoints.web.address=:80
                  - --entrypoints.websecure.address=:443
                  - --entrypoints.web.http.redirections.entryPoint.to=websecure
                  - --entrypoints.web.http.redirections.entryPoint.scheme=https
                  - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
                  - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
                  - --certificatesresolvers.letsencrypt.acme.email=\${ACME_EMAIL}
                  - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock:ro
                  - traefik_letsencrypt:/letsencrypt
                networks:
                  - keevo_net

              postgres:
                image: postgres:16-alpine
                container_name: keevo_postgres
                restart: unless-stopped
                mem_limit: 384m
                mem_reservation: 256m
                command:
                  - postgres
                  - -c
                  - shared_buffers=64MB
                  - -c
                  - work_mem=4MB
                  - -c
                  - maintenance_work_mem=32MB
                  - -c
                  - max_connections=30
                  - -c
                  - effective_cache_size=256MB
                environment:
                  POSTGRES_DB:       \${POSTGRES_DB}
                  POSTGRES_USER:     \${POSTGRES_USER}
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                networks:
                  - keevo_net

              backend:
                image: \${BACKEND_IMAGE}
                container_name: keevo_backend
                restart: unless-stopped
                mem_limit: 768m
                mem_reservation: 512m
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file: .env
                environment:
                  POSTGRES_HOST: postgres
                  POSTGRES_PORT: "5432"
                  SPRING_PROFILES_ACTIVE: prod
                  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
                  KEEVO_JWT_PRIVATE_KEY_PATH: file:/run/secrets/jwt/private_key.pem
                  KEEVO_JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt/public_key.pem
                volumes:
                  - ./firebase-credentials.json:/run/secrets/firebase:ro
                  - ./keys:/run/secrets/jwt:ro
                networks:
                  - keevo_net
                labels:
                  - traefik.enable=true
                  - traefik.http.routers.backend.rule=Host(\`${APP_DOMAIN}\`)
                  - traefik.http.routers.backend.entrypoints=websecure
                  - traefik.http.routers.backend.tls.certresolver=letsencrypt
                  - traefik.http.services.backend.loadbalancer.server.port=4500

            volumes:
              postgres_data:
              traefik_letsencrypt:

            networks:
              keevo_net:
                driver: bridge
            COMPOSE

            echo "→ Stopping old stack…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
            docker rm -f keevo_backend keevo_traefik keevo_postgres 2>/dev/null || true

            echo "→ Pulling new backend image…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml pull backend traefik

            echo "→ Starting / updating stack (backend + postgres + traefik)…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "→ Pruning dangling images…"
            docker image prune -f

            echo "✓ Deploy complete."
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml ps

# ─── Required GitHub Secrets ──────────────────────────────────────────────────
# GHCR_PAT                — GitHub PAT, scope: read:packages
# DEPLOY_SSH_HOST         — server IP / hostname  (44.223.221.74)
# DEPLOY_SSH_USER         — SSH user
# DEPLOY_SSH_PRIVATE_KEY  — full SSH private key (ed25519 recommended)
# DEPLOY_SSH_PORT         — optional, defaults to 22
# APP_DOMAIN              — public FQDN served by Traefik, e.g. keevo.example.com
#
# Files required on the server under ~/keevo/ :
#   .env                          → backend/.env.example filled with prod values
#                                    (POSTGRES_HOST is overridden by compose → "postgres")
#                                    + ACME_EMAIL=your@email.com  (for Let's Encrypt)
#   firebase-credentials.json     → Firebase service-account key
