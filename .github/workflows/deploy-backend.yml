name: Deploy Backend

# Production deploy of the whole stack: backend + admin dashboard (+ postgres, + traefik
# when this host runs our own Traefik). One generated compose file holds every service, so
# `docker compose up` never drops one.
#
# ─── Trigger ──────────────────────────────────────────────────────────────────
# Every push to `deploy` redeploys the stack. Images are rebuilt only when needed
# (.github/scripts/changed-components.sh): keevo/backend/** → backend image,
# keevo/dashboard/** → dashboard image, this workflow or that script → both — compared with
# the commit the current `:latest` tag was built from (its org.opencontainers.image.revision
# label), so a cancelled/superseded run never leaves a change unbuilt. An unchanged component
# is redeployed from `:latest` (built anyway if that tag does not exist yet, e.g. the very
# first dashboard deploy). Manual run: Actions → Run workflow on `deploy` (rebuilds both).
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend
  DASHBOARD_IMAGE_NAME: ${{ github.repository }}/dashboard

jobs:
  # ─── Job 0 : Which images must be rebuilt? ──────────────────────────────────
  changes:
    name: Detect changed components
    # A manual run from any other branch runs nothing — prod only receives `deploy`.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      dashboard: ${{ steps.detect.outputs.dashboard }}
      backend_image: ${{ steps.image.outputs.backend }}
      dashboard_image: ${{ steps.image.outputs.dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute lowercase image names
        id: image
        run: |
          echo "backend=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"             >> "$GITHUB_OUTPUT"
          echo "dashboard=$(echo "${REGISTRY}/${DASHBOARD_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: detect
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          BACKEND_IMAGE_REF: ${{ steps.image.outputs.backend }}:latest
          DASHBOARD_IMAGE_REF: ${{ steps.image.outputs.dashboard }}:latest
        run: |
          .github/scripts/changed-components.sh "${GITHUB_SHA}" .github/workflows/deploy-backend.yml

  # ─── Job 1a : Build & push backend image to GHCR ────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image ref
        id: image
        run: |
          IMAGE_LC=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_LC}"        >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_LC}:latest"  >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./keevo/backend
          file: ./keevo/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ─── Job 1b : Build & push admin dashboard image to GHCR ────────────────────
  build-dashboard:
    name: Build & Push dashboard image
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.dashboard_image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The backend URL is baked at build time (Next.js rewrites): the default build arg
      # http://backend:4500 is the compose service on keevo_net — see keevo/dashboard/Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./keevo/dashboard
          file: ./keevo/dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  # ─── Job 2 : Deploy stack (backend + dashboard + postgres) on production server ─
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: [changes, build-and-push, build-dashboard]
    # Runs when the skipped builds are skipped (unchanged component), never after a failure.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.build-and-push.result != 'failure'
      && needs.build-dashboard.result != 'failure'
    environment: production

    steps:
      - name: Checkout (pre-flight + backup scripts)
        uses: actions/checkout@v4

      # ADMIN_DOMAIN / ADMIN_PHONE / ADMIN_PASSWORD live in the server's ~/keevo/.env (not in
      # GitHub secrets): the check script is copied there and run before anything is pulled or
      # restarted, so a missing/invalid value stops the deploy while the running stack stays up.
      - name: Copy deploy pre-flight to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          source: ".github/scripts/check-prod-deploy-secrets.sh"
          target: "keevo/scripts"
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_REF: ${{ needs.changes.outputs.backend_image }}:latest
          DASHBOARD_IMAGE_REF: ${{ needs.changes.outputs.dashboard_image }}:latest
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          envs: GHCR_PAT,GH_ACTOR,IMAGE_REF,DASHBOARD_IMAGE_REF,APP_DOMAIN,ACME_EMAIL,JWT_PRIVATE_KEY_PEM,JWT_PUBLIC_KEY_PEM

          # ── Script that runs on the remote server ──────────────────────────────
          # Prerequisites on server:
          #   • Docker + Docker Compose plugin installed
          #   • ~/keevo/.env  (copy backend/.env.example, fill prod values;
          #     POSTGRES_HOST will be overridden by compose to "postgres")
          #   • ~/keevo/firebase-credentials.json  (Firebase service-account key)
          #   • JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM secrets (RSA 2048 PEM content)
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/keevo"

            mkdir -p "${DEPLOY_DIR}/keys"
            cd "${DEPLOY_DIR}"

            # ── Dashboard domain + super-admin bootstrap (from ~/keevo/.env) ────
            # The operator sets ADMIN_DOMAIN, ADMIN_PHONE and ADMIN_PASSWORD in ~/keevo/.env, next
            # to the other server values. The backend reads ADMIN_PHONE / ADMIN_PASSWORD from it
            # (env_file) and AdminAccountInitializer creates the SUPER_ADMIN only when that phone is
            # not registered yet — an existing account keeps its password. ADMIN_DOMAIN is only
            # needed here, to route the dashboard and set the backend DASHBOARD_ORIGIN.
            # Values are read like compose reads an env_file (last KEY=value, optional surrounding
            # quotes) and never echoed. Checked before any pull / restart: a bad value fails the
            # deploy while the running stack keeps serving.
            test -f .env || { echo "❌ ${DEPLOY_DIR}/.env not found" >&2; exit 1; }
            env_value() {
              local line
              line="$(grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" .env | tail -n 1)" || return 0
              line="${line#*=}"
              line="${line%$'\r'}"
              case "${line}" in
                \"*\") line="${line#\"}"; line="${line%\"}" ;;
                \'*\') line="${line#\'}"; line="${line%\'}" ;;
              esac
              printf '%s' "${line}"
            }
            ADMIN_DOMAIN="$(env_value ADMIN_DOMAIN)"
            APP_DOMAIN="${APP_DOMAIN}" ADMIN_DOMAIN="${ADMIN_DOMAIN}" \
              ADMIN_PHONE="$(env_value ADMIN_PHONE)" ADMIN_PASSWORD="$(env_value ADMIN_PASSWORD)" \
              bash "${DEPLOY_DIR}/scripts/check-prod-deploy-secrets.sh"

            echo "→ Writing RSA key pair for JWT…"
            printf '%s\n' "${JWT_PRIVATE_KEY_PEM}" > keys/private_key.pem
            printf '%s\n' "${JWT_PUBLIC_KEY_PEM}"  > keys/public_key.pem

            # The non-root `keevo` container (USER keevo, UID/GID 2001 per Dockerfile) must read
            # the private key, but the SSH deploy user is a non-root sudoer that CANNOT `chown`
            # to a different UID (no CAP_CHOWN). Strategy: keep the deploy user as OWNER (so
            # re-deploys can truncate the file) and let the container read via GROUP — `chgrp 2001`
            # + `chmod 640`. The deploy user must be a member of group GID 2001 on the host
            # (chgrp to a group you don't belong to requires root). Do NOT revert to `644`
            # (commit 708fa3e) — the public key alone may be world-readable, not the private one.
            #
            # One-time host prerequisite (run once as root on the prod host):
            #   sudo groupadd -g 2001 keevo-jwt && sudo usermod -aG keevo-jwt "${USER:-$(id -un)}"
            # NOTE: assumes the Docker daemon is NOT configured with user-namespace remapping
            # (userns-remap). With userns-remap, host GID 2001 maps to a different in-container
            # GID and the container would NOT be in this group → boot fails on key read.
            chgrp 2001 keys
            chmod 750 keys
            chgrp 2001 keys/private_key.pem keys/public_key.pem
            chmod 640 keys/private_key.pem
            chmod 644 keys/public_key.pem

            # Pre-flight assertions (AC2) — fail the deploy BEFORE `docker compose up`.
            # 1. Deploy user must be in group 2001, else chgrp above failed or no-op'd.
            case " $(id -G) " in
              *" 2001 "*) ;;
              *) echo "❌ deploy user is not in group 2001 (keevo-jwt) — run the host prerequisite (see comment above)" >&2; exit 1 ;;
            esac
            # 2. GID 2001 must be the keevo-jwt group (not a colliding host service account).
            test "$(getent group 2001 | cut -d: -f1)" = "keevo-jwt" || {
              echo "❌ GID 2001 is not 'keevo-jwt' on this host (collision?) — got: $(getent group 2001)" >&2; exit 1
            }
            # 3. Private key must NOT be world-readable (mode 640, no others-read).
            test "$(stat -c %a keys/private_key.pem)" = "640" || {
              echo "❌ private_key.pem must be mode 640 (got $(stat -c %a keys/private_key.pem))" >&2; exit 1
            }
            # 4. (defense-in-depth) The container UID/GID 2001 can actually read the key.
            docker run --rm -v "${DEPLOY_DIR}/keys:/keys:ro" --user 2001:2001 alpine \
              sh -c 'test -r /keys/private_key.pem' || {
                echo "❌ container UID 2001 cannot read keys/private_key.pem — check group/dir perms" >&2; exit 1
              }
            echo "✓ private_key.pem mode 640, group=keevo-jwt(2001), container-readable OK"

            # ── Firebase credentials — container UID 2001 must be able to read ──
            if [ -f firebase-credentials.json ]; then
              chgrp 2001 firebase-credentials.json 2>/dev/null || true
              chmod 640 firebase-credentials.json
              test "$(stat -c %a firebase-credentials.json)" = "640" || {
                echo "❌ firebase-credentials.json must be mode 640 (got $(stat -c %a firebase-credentials.json))" >&2; exit 1
              }
              echo "✓ firebase-credentials.json mode 640, group=keevo-jwt(2001)"
            else
              echo "⚠ firebase-credentials.json not found — FCM push will be disabled"
            fi

            echo "→ Authenticating with GHCR…"
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # ── Detect whether port 80 is already taken (external Traefik) ──────
            PORT80_FREE=false
            if ! ss -tlnp 2>/dev/null | grep -q ':80 ' && \
               ! docker ps --filter "publish=80" --format '{{.Names}}' 2>/dev/null | grep -q .; then
              PORT80_FREE=true
            fi

            if ${PORT80_FREE}; then
              echo "→ Port 80 free — deploying full stack (traefik + postgres + backend + dashboard)"
              TRAEFIK_ENABLED=true
            else
              echo "→ Port 80 already in use (external Traefik detected) — deploying postgres + backend + dashboard"
              TRAEFIK_ENABLED=false
            fi

            # ── Traefik dynamic config (only if we manage Traefik) ──────────────
            if ${TRAEFIK_ENABLED}; then
              echo "→ Writing traefik/dynamic.yml…"
              mkdir -p traefik
              cat > traefik/dynamic.yml << DYNAMIC
            # Upstreams use the CONTAINER names: keevo_traefik may also be attached to keevo_edge
            # (staging, checklist §15), where the compose aliases "backend" / "dashboard" resolve
            # to the STAGING containers. Container names are unique on the host.
            http:
              routers:
                backend:
                  rule: "Host(\`${APP_DOMAIN}\`)"
                  entryPoints:
                    - websecure
                  tls:
                    certResolver: letsencrypt
                  service: backend
                dashboard:
                  rule: "Host(\`${ADMIN_DOMAIN}\`)"
                  entryPoints:
                    - websecure
                  tls:
                    certResolver: letsencrypt
                  service: dashboard

              services:
                backend:
                  loadBalancer:
                    servers:
                      - url: "http://keevo_backend:4500"
                    healthCheck:
                      path: /actuator/health
                      interval: 10s
                      timeout: 5s
                dashboard:
                  loadBalancer:
                    servers:
                      - url: "http://keevo_dashboard:3000"
                    healthCheck:
                      path: /login
                      interval: 10s
                      timeout: 5s
            DYNAMIC
            fi

            # ── Docker Compose ─────────────────────────────────────────────────
            echo "→ Writing docker-compose.prod.yml…"
            if ${TRAEFIK_ENABLED}; then
              # --- Full stack: traefik + postgres + backend + dashboard ---
              cat > docker-compose.prod.yml << COMPOSE
            services:

              traefik:
                image: traefik:v3.3
                container_name: keevo_traefik
                restart: unless-stopped
                mem_limit: 128m
                mem_reservation: 64m
                command:
                  - --providers.file.filename=/etc/traefik/dynamic.yml
                  - --providers.file.watch=true
                  - --entrypoints.web.address=:80
                  - --entrypoints.websecure.address=:443
                  - --entrypoints.web.http.redirections.entryPoint.to=websecure
                  - --entrypoints.web.http.redirections.entryPoint.scheme=https
                  - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
                  - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
                  - --certificatesresolvers.letsencrypt.acme.email=\${ACME_EMAIL}
                  - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
                  - traefik_letsencrypt:/letsencrypt
                networks:
                  - keevo_net

              postgres:
                image: postgres:16-alpine
                container_name: keevo_postgres
                restart: unless-stopped
                mem_limit: 384m
                mem_reservation: 256m
                command:
                  - postgres
                  - -c
                  - shared_buffers=64MB
                  - -c
                  - work_mem=4MB
                  - -c
                  - maintenance_work_mem=32MB
                  - -c
                  - max_connections=30
                  - -c
                  - effective_cache_size=256MB
                environment:
                  POSTGRES_DB:       \${POSTGRES_DB}
                  POSTGRES_USER:     \${POSTGRES_USER}
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                networks:
                  - keevo_net

              backend:
                image: ${IMAGE_REF}
                container_name: keevo_backend
                restart: unless-stopped
                mem_limit: 768m
                mem_reservation: 512m
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file:
                  - .env
                environment:
                  POSTGRES_HOST: postgres
                  POSTGRES_PORT: "5432"
                  SPRING_PROFILES_ACTIVE: prod
                  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
                  KEEVO_JWT_PRIVATE_KEY_PATH: file:/run/secrets/jwt/private_key.pem
                  KEEVO_JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt/public_key.pem
                  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
                  SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
                  KEEVO_PRODUCT_PHOTO_DIR: /app/data/product-photos
                  # Story 11.4 CORS allow-list. Required: the dashboard proxy forwards the browser Origin
                  DASHBOARD_ORIGIN: "https://${ADMIN_DOMAIN}"
                volumes:
                  - ./firebase-credentials.json:/run/secrets/firebase:ro
                  - ./keys:/run/secrets/jwt:ro
                  # Product photos — persistent named volume (only copy), backed up by backup-db.sh
                  - product_photos:/app/data/product-photos
                networks:
                  - keevo_net

              # Admin dashboard (Next.js standalone). Calls the API server-side through the
              # compose network: http://backend:4500 is baked into the image (Next.js rewrites are
              # resolved at build time, see keevo/dashboard/Dockerfile) — nothing to set at runtime.
              dashboard:
                image: ${DASHBOARD_IMAGE_REF}
                container_name: keevo_dashboard
                restart: unless-stopped
                mem_limit: 256m
                mem_reservation: 128m
                depends_on:
                  - backend
                environment:
                  NODE_ENV: production
                  NEXT_TELEMETRY_DISABLED: "1"
                networks:
                  - keevo_net

            volumes:
              postgres_data:
              traefik_letsencrypt:
              product_photos:

            networks:
              keevo_net:
                driver: bridge
            COMPOSE
            else
              # --- Light stack: postgres + backend + dashboard (external Traefik, labels) ---
              cat > docker-compose.prod.yml << COMPOSE
            services:

              postgres:
                image: postgres:16-alpine
                container_name: keevo_postgres
                restart: unless-stopped
                mem_limit: 384m
                mem_reservation: 256m
                command:
                  - postgres
                  - -c
                  - shared_buffers=64MB
                  - -c
                  - work_mem=4MB
                  - -c
                  - maintenance_work_mem=32MB
                  - -c
                  - max_connections=30
                  - -c
                  - effective_cache_size=256MB
                environment:
                  POSTGRES_DB:       \${POSTGRES_DB}
                  POSTGRES_USER:     \${POSTGRES_USER}
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U \$\$POSTGRES_USER -d \$\$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                networks:
                  - keevo_net

              backend:
                image: ${IMAGE_REF}
                container_name: keevo_backend
                restart: unless-stopped
                mem_limit: 768m
                mem_reservation: 512m
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file:
                  - .env
                environment:
                  POSTGRES_HOST: postgres
                  POSTGRES_PORT: "5432"
                  SPRING_PROFILES_ACTIVE: prod
                  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
                  KEEVO_JWT_PRIVATE_KEY_PATH: file:/run/secrets/jwt/private_key.pem
                  KEEVO_JWT_PUBLIC_KEY_PATH: file:/run/secrets/jwt/public_key.pem
                  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
                  SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
                  KEEVO_PRODUCT_PHOTO_DIR: /app/data/product-photos
                  # Story 11.4 CORS allow-list. Required: the dashboard proxy forwards the browser Origin
                  DASHBOARD_ORIGIN: "https://${ADMIN_DOMAIN}"
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.keevo-backend.rule=Host(\`${APP_DOMAIN}\`)"
                  - "traefik.http.routers.keevo-backend.entrypoints=websecure"
                  - "traefik.http.routers.keevo-backend.tls=true"
                  - "traefik.http.routers.keevo-backend.tls.certresolver=mytlschallenge"
                  - "traefik.http.services.keevo-backend.loadbalancer.server.port=4500"
                volumes:
                  - ./firebase-credentials.json:/run/secrets/firebase:ro
                  - ./keys:/run/secrets/jwt:ro
                  # Product photos — persistent named volume (only copy), backed up by backup-db.sh
                  - product_photos:/app/data/product-photos
                networks:
                  - keevo_net
                  - traefik-public

              # Admin dashboard (Next.js standalone). Calls the API server-side through the
              # compose network: http://backend:4500 is baked into the image (Next.js rewrites are
              # resolved at build time, see keevo/dashboard/Dockerfile) — nothing to set at runtime.
              dashboard:
                image: ${DASHBOARD_IMAGE_REF}
                container_name: keevo_dashboard
                restart: unless-stopped
                mem_limit: 256m
                mem_reservation: 128m
                depends_on:
                  - backend
                environment:
                  NODE_ENV: production
                  NEXT_TELEMETRY_DISABLED: "1"
                labels:
                  - "traefik.enable=true"
                  - "traefik.docker.network=traefik-public"
                  - "traefik.http.routers.keevo-dashboard.rule=Host(\`${ADMIN_DOMAIN}\`)"
                  - "traefik.http.routers.keevo-dashboard.entrypoints=websecure"
                  - "traefik.http.routers.keevo-dashboard.tls=true"
                  - "traefik.http.routers.keevo-dashboard.tls.certresolver=mytlschallenge"
                  - "traefik.http.services.keevo-dashboard.loadbalancer.server.port=3000"
                networks:
                  - keevo_net
                  - traefik-public

            volumes:
              postgres_data:
              product_photos:

            networks:
              keevo_net:
                driver: bridge
              traefik-public:
                external: true
            COMPOSE
            fi

            # ── Deploy ─────────────────────────────────────────────────────────
            # No `compose down`: `up -d` re-creates only the services whose image or
            # configuration changed, so a dashboard-only push does not restart the backend
            # (and vice versa). Image refs are written into the compose file, so manual
            # `docker compose -f docker-compose.prod.yml …` works without extra env.
            COMPOSE_PROJECT="$(basename "${DEPLOY_DIR}")"
            # A same-name container NOT owned by this compose project (manual `docker run`,
            # older stack) would make `up` fail on the name conflict: remove only those.
            for c in keevo_traefik keevo_postgres keevo_backend keevo_dashboard; do
              owner="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "${c}" 2>/dev/null)" || continue
              if [ "${owner}" != "${COMPOSE_PROJECT}" ]; then
                echo "→ Removing ${c} (not managed by compose project ${COMPOSE_PROJECT})"
                docker rm -f "${c}"
              fi
            done

            echo "→ Pulling images…"
            if ${TRAEFIK_ENABLED}; then
              docker compose -f docker-compose.prod.yml pull backend dashboard traefik
            else
              docker compose -f docker-compose.prod.yml pull backend dashboard
            fi

            echo "→ Starting / updating stack…"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "→ Waiting for backend and dashboard to be healthy (max 180 s)…"
            backend_ok=false
            dashboard_ok=false
            for _ in $(seq 1 36); do
              if ! ${backend_ok} && docker exec keevo_backend wget -qO- http://localhost:4500/actuator/health 2>/dev/null \
                   | grep -q '"status":"UP"'; then
                backend_ok=true
              fi
              if ! ${dashboard_ok} && [ "$(docker inspect -f '{{.State.Health.Status}}' keevo_dashboard 2>/dev/null)" = "healthy" ]; then
                dashboard_ok=true
              fi
              if ${backend_ok} && ${dashboard_ok}; then break; fi
              sleep 5
            done
            if ! ${backend_ok}; then
              echo "❌ keevo_backend not healthy after 180 s — last logs:" >&2
              docker logs --tail 80 keevo_backend >&2 || true
              exit 1
            fi
            if ! ${dashboard_ok}; then
              echo "❌ keevo_dashboard not healthy after 180 s — last logs:" >&2
              docker logs --tail 80 keevo_dashboard >&2 || true
              exit 1
            fi
            echo "✓ keevo_backend /actuator/health UP, keevo_dashboard healthy"

            echo "→ Pruning dangling images…"
            docker image prune -f

            echo "✓ Deploy complete."
            docker compose -f docker-compose.prod.yml ps

      # The committed backup scripts/units (checked out above) are copied as-is
      # (single source of truth — no inline duplication that drifts).
      - name: Copy backup scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          source: "keevo/backend/scripts/backup-db.sh,keevo/backend/scripts/backup-alert.sh,keevo/backend/scripts/render-backup-units.sh,keevo/backend/scripts/keevo-backup.service,keevo/backend/scripts/keevo-backup-alert@.service,keevo/backend/scripts/keevo-backup.timer"
          target: "keevo/scripts"
          strip_components: 3

      - name: Install systemd backup timer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/keevo"
            chmod +x "${DEPLOY_DIR}/scripts/backup-db.sh" "${DEPLOY_DIR}/scripts/backup-alert.sh" \
                     "${DEPLOY_DIR}/scripts/render-backup-units.sh"

            # Install the committed systemd units (single source of truth).
            # Story 10-7: the service units carry the __KEEVO_HOME__ placeholder (no hardcoded
            # /home/ubuntu). Render into a temp dir (escaped sed, placeholder check), verify,
            # and only then move into /etc/systemd/system.
            UNITS_TMP="$(mktemp -d)"
            trap 'rm -rf "${UNITS_TMP}"' EXIT
            "${DEPLOY_DIR}/scripts/render-backup-units.sh" "${DEPLOY_DIR}" "${DEPLOY_DIR}/scripts" "${UNITS_TMP}"
            if command -v systemd-analyze > /dev/null 2>&1; then
              cp "${UNITS_TMP}/keevo-backup-alert@.service" "${UNITS_TMP}/keevo-backup-alert@keevo-backup.service.service"
              ( cd "${UNITS_TMP}" && SYSTEMD_UNIT_PATH="${UNITS_TMP}:" systemd-analyze verify \
                  keevo-backup.service keevo-backup.timer keevo-backup-alert@keevo-backup.service.service )
              rm -f "${UNITS_TMP}/keevo-backup-alert@keevo-backup.service.service"
            fi
            sudo install -m 644 "${UNITS_TMP}/keevo-backup.service" "${UNITS_TMP}/keevo-backup-alert@.service" \
                 "${UNITS_TMP}/keevo-backup.timer" /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable keevo-backup.timer
            sudo systemctl start keevo-backup.timer

            echo "✓ Backup timer installed (from committed scripts)."
            systemctl status keevo-backup.timer --no-pager || true

            # Story 10-7: warn (do not fail the deploy) when the backup env file is missing —
            # the timer would then fail every night (and raise the OnFailure alert).
            if [ ! -f "${DEPLOY_DIR}/.env.backup" ]; then
              echo "::warning::${DEPLOY_DIR}/.env.backup is missing — nightly backups will FAIL. Create it (keevo/backend/docs/DEPLOYMENT_CHECKLIST.md § Backups)."
              echo "⚠ WARNING: ${DEPLOY_DIR}/.env.backup is missing — nightly backups will FAIL until it is created (see DEPLOYMENT_CHECKLIST.md § Backups)."
            fi
            if ! sudo grep -qsE '^BACKUP_ALERT_WEBHOOK_URL=[^"[:space:]]' "${DEPLOY_DIR}/.env.backup-alert" "${DEPLOY_DIR}/.env.backup"; then
              echo "::warning::BACKUP_ALERT_WEBHOOK_URL not configured — backup failures are only logged to journald (DEPLOYMENT_CHECKLIST.md § Backups)."
              echo "⚠ WARNING: BACKUP_ALERT_WEBHOOK_URL not configured — backup failures are only logged to journald (see DEPLOYMENT_CHECKLIST.md § Backups)."
            fi

            # Story 10-7: the prod deploy re-creates keevo_traefik (and rewrites traefik/dynamic.yml
            # when it manages Traefik), which drops the staging routing. Re-attach the prod Traefik
            # to keevo_edge (idempotent, only that attachment) and remind the operator.
            if docker network inspect keevo_edge > /dev/null 2>&1; then
              docker network connect keevo_edge keevo_traefik 2>/dev/null || true
            fi
            if [ -d "${HOME}/keevo-staging" ]; then
              echo "::warning::Staging présent : le routeur staging et l'attache keevo_edge doivent être réappliqués (checklist §15)."
              echo "⚠ WARNING: le routeur staging et l'attache keevo_edge doivent être réappliqués (DEPLOYMENT_CHECKLIST.md §15)."
            fi

# ─── Required GitHub Secrets ──────────────────────────────────────────────────
# GHCR_PAT                — GitHub PAT, scope: read:packages
# DEPLOY_SSH_HOST         — server IP / hostname (prod: the host behind keevo.ad2s.cm)
# DEPLOY_SSH_USER         — SSH user
# DEPLOY_SSH_PRIVATE_KEY  — full SSH private key (ed25519 recommended)
# DEPLOY_SSH_PORT         — optional, defaults to 22
# APP_DOMAIN              — public API FQDN served by Traefik (prod: keevo.ad2s.cm); also the
#                            API_BASE_URL of the release app (release-flutter.yml)
# Server ~/keevo/.env (NOT GitHub secrets), checked on the server before the deploy:
# ADMIN_DOMAIN            — admin dashboard FQDN (bare host, ≠ APP_DOMAIN), e.g. admin.keevo.ad2s.cm;
#                            DNS A record → server; also sets the backend DASHBOARD_ORIGIN
# ADMIN_PHONE             — SUPER_ADMIN phone (+2376…), created on first boot if not registered
# ADMIN_PASSWORD          — SUPER_ADMIN initial password (>= 12 chars, 3 of 4 classes, not a
#                            default); used only when the account is created, never resets it
# ACME_EMAIL, JWT_PRIVATE_KEY_PEM, JWT_PUBLIC_KEY_PEM — see DEPLOYMENT_CHECKLIST.md §7
#
# Files required on the server under ~/keevo/ :
#   .env                          → backend/.env.example filled with prod values
#                                    (POSTGRES_HOST is overridden by compose → "postgres")
#                                    + ACME_EMAIL=your@email.com  (for Let's Encrypt)
#   firebase-credentials.json     → Firebase service-account key
#   .env.backup                   → backup env vars (mode 600):
#                                    POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#                                    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
#                                    BACKUP_S3_BUCKET, BACKUP_S3_PREFIX
#                                    (see keevo/backend/docs/DEPLOYMENT_CHECKLIST.md § Backups)
#   .env.backup-alert             → optional, mode 600: BACKUP_ALERT_WEBHOOK_URL
#                                    (+ BACKUP_ALERT_WEBHOOK_TOKEN, BACKUP_ALERT_TO)
