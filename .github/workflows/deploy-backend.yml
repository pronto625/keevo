name: Deploy Backend

# ─── Trigger ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - deploy

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─── Job 1 : Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./keevo/backend
          file: ./keevo/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2 : Deploy stack (backend + postgres) on production server ──────────
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      # Copy the production compose file to the runner workspace so we can SCP it.
      # We generate it here rather than committing it, so no secrets leak to the repo.
      - name: Generate docker-compose.prod.yml
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          KEEVO_TAG: ${{ github.sha }}
        run: |
          cat > /tmp/docker-compose.prod.yml << 'COMPOSE'
          version: "3.9"

          services:
            # ── PostgreSQL ─────────────────────────────────────────────────────
            postgres:
              image: postgres:16-alpine
              container_name: keevo_postgres
              restart: unless-stopped
              environment:
                POSTGRES_DB:       ${POSTGRES_DB}
                POSTGRES_USER:     ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
                interval: 10s
                timeout: 5s
                retries: 10
              networks:
                - keevo_net

            # ── Spring Boot backend ────────────────────────────────────────────
            backend:
              image: ${BACKEND_IMAGE}
              container_name: keevo_backend
              restart: unless-stopped
              depends_on:
                postgres:
                  condition: service_healthy
              env_file: .env
              environment:
                # Override POSTGRES_HOST so the app talks to the compose service,
                # not 'localhost' (which would be the container itself).
                POSTGRES_HOST: postgres
                POSTGRES_PORT: "5432"
                SPRING_PROFILES_ACTIVE: prod
                GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
              volumes:
                - ./firebase-credentials.json:/run/secrets/firebase:ro
              ports:
                - "8080:8080"
              networks:
                - keevo_net

          volumes:
            postgres_data:

          networks:
            keevo_net:
              driver: bridge
          COMPOSE

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          envs: GHCR_PAT,GH_ACTOR,IMAGE_REF

          # ── Script that runs on the remote server ──────────────────────────────
          # Prerequisites on server:
          #   • Docker + Docker Compose plugin installed
          #   • ~/keevo/.env  (copy backend/.env.example, fill prod values;
          #     POSTGRES_HOST will be overridden by compose to "postgres")
          #   • ~/keevo/firebase-credentials.json  (Firebase service-account key)
          script: |
            set -euo pipefail
            DEPLOY_DIR="${HOME}/keevo"

            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            echo "→ Authenticating with GHCR…"
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "→ Writing docker-compose.prod.yml…"
            cat > docker-compose.prod.yml << 'COMPOSE'
            version: "3.9"

            services:
              postgres:
                image: postgres:16-alpine
                container_name: keevo_postgres
                restart: unless-stopped
                environment:
                  POSTGRES_DB:       ${POSTGRES_DB}
                  POSTGRES_USER:     ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                networks:
                  - keevo_net

              backend:
                image: ${BACKEND_IMAGE}
                container_name: keevo_backend
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                env_file: .env
                environment:
                  POSTGRES_HOST: postgres
                  POSTGRES_PORT: "5432"
                  SPRING_PROFILES_ACTIVE: prod
                  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase
                volumes:
                  - ./firebase-credentials.json:/run/secrets/firebase:ro
                ports:
                  - "8080:8080"
                networks:
                  - keevo_net

            volumes:
              postgres_data:

            networks:
              keevo_net:
                driver: bridge
            COMPOSE

            echo "→ Pulling new backend image…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml pull backend

            echo "→ Starting / updating stack (backend + postgres)…"
            BACKEND_IMAGE="${IMAGE_REF}" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "→ Pruning dangling images…"
            docker image prune -f

            echo "✓ Deploy complete."
            docker compose -f docker-compose.prod.yml ps

# ─── Required GitHub Secrets ──────────────────────────────────────────────────
# GHCR_PAT                — GitHub PAT, scope: read:packages
# DEPLOY_SSH_HOST         — server IP / hostname
# DEPLOY_SSH_USER         — SSH user
# DEPLOY_SSH_PRIVATE_KEY  — full SSH private key (ed25519 recommended)
# DEPLOY_SSH_PORT         — optional, defaults to 22
#
# Files required on the server under ~/keevo/ :
#   .env                          → backend/.env.example filled with prod values
#                                    (POSTGRES_HOST is overridden by compose → "postgres")
#   firebase-credentials.json     → Firebase service-account key
