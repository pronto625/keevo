name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches:
      - main
      - develop

jobs:
  flutter-test:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      # keevo/app is a Melos 7 / pub workspace root (Story 15.4a):
      # bootstrap (= pub get at the root) resolves the app and keevo_core.
      - name: Install dependencies
        working-directory: keevo/app
        run: dart run melos bootstrap

      - name: Run code generation (keevo_core, then app)
        working-directory: keevo/app
        run: dart run melos generate

      - name: Analyze
        working-directory: keevo/app
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Analyze (keevo_core)
        working-directory: keevo/app/packages/keevo_core
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test (keevo_core)
        working-directory: keevo/app/packages/keevo_core
        run: flutter test --no-pub --coverage

      - name: Test
        working-directory: keevo/app
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: |
            keevo/app/coverage/
            keevo/app/packages/keevo_core/coverage/
