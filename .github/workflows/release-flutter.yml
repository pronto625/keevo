name: Release Flutter

# ─── Trigger ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - deploy

# ─── Concurrency ────────────────────────────────────────────────────────────────────────────
concurrency:
  group: release-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.0'
  JAVA_VERSION: '17'

# ─── Permissions ──────────────────────────────────────────────────────────────
# `contents: write` is required to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 : Android APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: keevo/app
        run: flutter pub get

      # Story 15.4a — kernel (keevo_core, Drift) first, then the app.
      - name: Run code generation (keevo_core, then app)
        working-directory: keevo/app
        run: dart run melos generate

      - name: Decode release keystore
        working-directory: keevo/app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > keevo-release.keystore

      - name: Write key.properties
        working-directory: keevo/app/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > key.properties << EOF
          storeFile=keevo-release.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      # The app talks to the same host the backend is published on (deploy-backend.yml routes
      # APP_DOMAIN through Traefik). One source of truth: the APP_DOMAIN secret — never a
      # hard-coded URL that can drift from the server. A release built without an https URL
      # refuses to start (lib/core/network/api_base_url.dart), so fail here instead.
      - name: Resolve production API URL
        id: api
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          set -euo pipefail
          domain="${APP_DOMAIN:-}"
          domain="${domain#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          if [[ -z "${domain}" ]]; then
            echo "::error::Secret APP_DOMAIN manquant — impossible de construire l'app avec l'adresse du serveur de production."
            exit 1
          fi
          if [[ ! "${domain}" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::APP_DOMAIN invalide (attendu : nom de domaine seul, ex. keevo.example.com)."
            exit 1
          fi
          echo "url=https://${domain}" >> "$GITHUB_OUTPUT"
          echo "API_BASE_URL de l'app : https://${domain}"

      - name: Build release APK
        working-directory: keevo/app
        env:
          API_BASE_URL: ${{ steps.api.outputs.url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="${API_BASE_URL}"

      - name: Check the backend answers on that URL
        # Non-blocking: the backend may be deploying in parallel (same push). A warning makes a
        # wrong domain visible in the run summary without failing the release.
        continue-on-error: true
        env:
          API_BASE_URL: ${{ steps.api.outputs.url }}
        run: |
          if curl -fsS --max-time 15 --retry 5 --retry-delay 20 "${API_BASE_URL}/actuator/health" | grep -q '"UP"'; then
            echo "Backend joignable : ${API_BASE_URL}"
          else
            echo "::warning::Le backend ne répond pas sur ${API_BASE_URL}/actuator/health — vérifier APP_DOMAIN / le déploiement backend."
          fi

      - name: Rename APK
        run: |
          mv keevo/app/build/app/outputs/flutter-apk/app-release.apk \
             keevo/app/build/app/outputs/flutter-apk/keevo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: keevo/app/build/app/outputs/flutter-apk/keevo.apk
          retention-days: 1

