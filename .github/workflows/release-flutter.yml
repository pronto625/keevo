name: Release Flutter

# ─── Trigger ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - deploy

# ─── Concurrency ────────────────────────────────────────────────────────────────────────────
concurrency:
  group: release-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.0'
  JAVA_VERSION: '17'

# ─── Permissions ──────────────────────────────────────────────────────────────
# `contents: write` is required to create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 : Android APK
  # ─────────────────────────────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: keevo/app
        run: flutter pub get

      - name: Run code generation (Freezed / Drift / Riverpod)
        working-directory: keevo/app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore
        working-directory: keevo/app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > keevo-release.keystore

      - name: Write key.properties
        working-directory: keevo/app/android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > key.properties << EOF
          storeFile=app/keevo-release.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build release APK
        working-directory: keevo/app
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: flutter build apk --release --dart-define=API_BASE_URL=https://${APP_DOMAIN}

      - name: Rename APK
        run: |
          mv keevo/app/build/app/outputs/flutter-apk/app-release.apk \
             keevo/app/build/app/outputs/flutter-apk/keevo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: keevo/app/build/app/outputs/flutter-apk/keevo.apk
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 : iOS IPA  (macOS required)
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: keevo/app
        run: flutter pub get

      - name: Run code generation
        working-directory: keevo/app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Import distribution certificate & provisioning profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/keevo-signing.keychain-db"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -t 3600 -u "${KEYCHAIN_PATH}"
          echo "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/dist.p12"
          security import "${RUNNER_TEMP}/dist.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          PP_DIR="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${PP_DIR}"
          echo "${PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PP_DIR}/keevo.mobileprovision"

      - name: Build Flutter iOS (no codesign)
        working-directory: keevo/app
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://${APP_DOMAIN}

      - name: Archive with Xcode
        working-directory: keevo/app/ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/keevo.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${IOS_PROVISIONING_PROFILE_SPECIFIER}" \
            | xcpretty || true

      - name: Export IPA (Ad Hoc)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "${RUNNER_TEMP}/export-options.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath        "${RUNNER_TEMP}/keevo.xcarchive" \
            -exportPath         "${RUNNER_TEMP}/ipa" \
            -exportOptionsPlist "${RUNNER_TEMP}/export-options.plist" \
            | xcpretty || true
          mv "${RUNNER_TEMP}/ipa/"*.ipa "${RUNNER_TEMP}/ipa/keevo.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/keevo.ipa
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 : Create GitHub Release — attach APK + IPA as assets.
  # Runs after both build jobs succeed.
  # Permanent download URL (no auth, no bucket):
  #   https://github.com/<owner>/<repo>/releases/latest/download/keevo.apk
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-apk
      - build-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        working-directory: keevo/app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "tag=mobile/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date '+%d %B %Y')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}"   >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Keevo ${{ steps.version.outputs.version }} — ${{ steps.version.outputs.date }}"
          prerelease: false
          make_latest: true
          body: |
            ## Keevo ${{ steps.version.outputs.version }}

            **Build :** `${{ steps.version.outputs.sha }}`  |  **Date :** ${{ steps.version.outputs.date }}

            ---

            ### Téléchargement

            | Plateforme | Fichier | Lien direct |
            |---|---|---|
            | Android | `keevo.apk` | [⬇ Télécharger APK](https://github.com/${{ github.repository }}/releases/latest/download/keevo.apk) |
            | iOS (Ad Hoc) | `keevo.ipa` | [⬇ Télécharger IPA](https://github.com/${{ github.repository }}/releases/latest/download/keevo.ipa) |

            > **Android :** activez *Sources inconnues* (Paramètres → Sécurité) avant d'installer.
            > **iOS :** profil Ad Hoc — l'appareil doit être enregistré dans le provisioning profile.
          files: |
            dist/keevo.apk
            dist/keevo.ipa

      - name: Print download URLs
        run: |
          echo "────────────────────────────────────────────────────────────────────────"
          echo "  Release page : https://github.com/${{ github.repository }}/releases/latest"
          echo "  APK (latest) : https://github.com/${{ github.repository }}/releases/latest/download/keevo.apk"
          echo "  IPA (latest) : https://github.com/${{ github.repository }}/releases/latest/download/keevo.ipa"
          echo "────────────────────────────────────────────────────────────────────────"

# ─── Required GitHub Actions Secrets ─────────────────────────────────────────────────────────────────
# Settings → Secrets and variables → Actions → Repository secrets
#
# ── Android ───────────────────────────────────────────────────────────────────────────────
#  ANDROID_KEYSTORE_BASE64   — base64 -w0 keevo-release.keystore
#  ANDROID_KEY_ALIAS         — key alias (e.g. "upload")
#  ANDROID_STORE_PASSWORD    — keystore password
#  ANDROID_KEY_PASSWORD      — key password
#
# ── iOS ───────────────────────────────────────────────────────────────────────────────────
#  IOS_CERTIFICATE_P12_BASE64         — base64 of .p12 distribution certificate
#  IOS_CERTIFICATE_PASSWORD           — P12 export password
#  IOS_PROVISIONING_PROFILE_BASE64    — base64 of Ad Hoc .mobileprovision
#  IOS_KEYCHAIN_PASSWORD              — any strong password (temp keychain)
#  IOS_TEAM_ID                        — Apple Developer Team ID (10-char)
#  IOS_PROVISIONING_PROFILE_SPECIFIER — profile name shown in Xcode
#
# ── Aucun service externe requis ───────────────────────────────────────────────────────────
# APK + IPA sont publiés directement en tant qu'assets GitHub Release.
# URLs permanentes (publiques, sans authentification) :
#   https://github.com/<owner>/<repo>/releases/latest/download/keevo.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/keevo.ipa
# ───────────────────────────────────────────────────────────────────────────────────
