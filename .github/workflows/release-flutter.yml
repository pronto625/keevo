  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 : Create GitHub Release — attach APK + IPA as assets.
  # Runs after both build jobs succeed.
  # Permanent download URL (no auth, no bucket):
  #   https://github.com/<owner>/<repo>/releases/latest/download/keevo.apk
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-apk
      # - build-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        working-directory: keevo/app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "tag=mobile/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date '+%d %B %Y')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}"   >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/

      # - name: Download IPA artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: ios-ipa
      #     path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Keevo ${{ steps.version.outputs.version }} — ${{ steps.version.outputs.date }}"
          prerelease: false
          make_latest: true
          body: |
            ## Keevo ${{ steps.version.outputs.version }}

            **Build :** `${{ steps.version.outputs.sha }}`  |  **Date :** ${{ steps.version.outputs.date }}

            ---

            ### Téléchargement

            | Plateforme | Fichier | Lien direct |
            |---|---|---|
            | Android | `keevo.apk` | [⬇ Télécharger APK](https://github.com/${{ github.repository }}/releases/latest/download/keevo.apk) |

            > **Android :** activez *Sources inconnues* (Paramètres → Sécurité) avant d'installer.
          files: |
            dist/keevo.apk

      - name: Print download URLs
        run: |
          echo "────────────────────────────────────────────────────────────────────────"
          echo "  Release page : https://github.com/${{ github.repository }}/releases/latest"
          echo "  APK (latest) : https://github.com/${{ github.repository }}/releases/latest/download/keevo.apk"
          echo "────────────────────────────────────────────────────────────────────────"

# ─── Required GitHub Actions Secrets ─────────────────────────────────────────────────────────────────
# Settings → Secrets and variables → Actions → Repository secrets
#
# ── Serveur ───────────────────────────────────────────────────────────────────────────────
#  APP_DOMAIN                — domaine du backend (sans https://), le même que deploy-backend.yml ;
#                              l'app est construite avec API_BASE_URL=https://<APP_DOMAIN>
#
# ── Android ───────────────────────────────────────────────────────────────────────────────
#  ANDROID_KEYSTORE_BASE64   — base64 -w0 keevo-release.keystore
#  ANDROID_KEY_ALIAS         — key alias (e.g. "upload")
#  ANDROID_STORE_PASSWORD    — keystore password
#  ANDROID_KEY_PASSWORD      — key password
#
# ── iOS ───────────────────────────────────────────────────────────────────────────────────
#  IOS_CERTIFICATE_P12_BASE64         — base64 of .p12 distribution certificate
#  IOS_CERTIFICATE_PASSWORD           — P12 export password
#  IOS_PROVISIONING_PROFILE_BASE64    — base64 of Ad Hoc .mobileprovision
#  IOS_KEYCHAIN_PASSWORD              — any strong password (temp keychain)
#  IOS_TEAM_ID                        — Apple Developer Team ID (10-char)
#  IOS_PROVISIONING_PROFILE_SPECIFIER — profile name shown in Xcode
#
# ── Aucun service externe requis ───────────────────────────────────────────────────────────
# APK + IPA sont publiés directement en tant qu'assets GitHub Release.
# URLs permanentes (publiques, sans authentification) :
#   https://github.com/<owner>/<repo>/releases/latest/download/keevo.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/keevo.ipa
# ───────────────────────────────────────────────────────────────────────────────────
