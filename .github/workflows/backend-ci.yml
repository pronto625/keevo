name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Story 12.1 lint — JWT key permissions in deploy-backend.yml
        run: bash keevo/backend/scripts/grep-lint-story-12-1.sh

      # Story 10-7 — backup alerting and ops scripts/workflows (pinned tool images).
      - name: Story 10.7 test — backup failure alert and rendered units
        run: bash keevo/backend/scripts/tests/backup-alert-test.sh

      - name: Story 10.7 lint — shellcheck (backup scripts)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/keevo/backend/scripts:/mnt:ro" \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            backup-db.sh backup-alert.sh render-backup-units.sh tests/backup-alert-test.sh

      - name: Story 10.7 lint — actionlint (deploy workflows)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -no-color .github/workflows/deploy-staging.yml .github/workflows/deploy-backend.yml .github/workflows/backend-ci.yml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # v1s-15-11: no Postgres service — the tests start their own Testcontainer
      # (postgres:16-alpine) on the runner's Docker, with the `test` profile.
      - name: Build and test
        working-directory: keevo/backend
        run: mvn test --batch-mode --no-transfer-progress
        env:
          JWT_SECRET: ci_test_secret_minimum_256_bits_long_for_hmac_sha256_algorithm
          JWT_EXPIRATION_MS: 15552000000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: keevo/backend/target/surefire-reports/

      - name: Upload architecture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-reports
          path: |
            keevo/backend/target/spring-modulith-docs/
            keevo/backend/target/modulith-violations.txt
            keevo/backend/target/archunit-violations.txt
          retention-days: 30
