name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keevo_test
          POSTGRES_USER: keevo
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: keevo/backend
        run: mvn test --batch-mode --no-transfer-progress
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: keevo_test
          POSTGRES_USER: keevo
          POSTGRES_PASSWORD: ci_password
          JWT_SECRET: ci_test_secret_minimum_256_bits_long_for_hmac_sha256_algorithm
          JWT_EXPIRATION_MS: 15552000000
          SPRING_PROFILES_ACTIVE: dev

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: keevo/backend/target/surefire-reports/
