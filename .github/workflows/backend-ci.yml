name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Story 12.1 lint — JWT key permissions in deploy-backend.yml
        run: bash keevo/backend/scripts/grep-lint-story-12-1.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # v1s-15-11: no Postgres service — the tests start their own Testcontainer
      # (postgres:16-alpine) on the runner's Docker, with the `test` profile.
      - name: Build and test
        working-directory: keevo/backend
        run: mvn test --batch-mode --no-transfer-progress
        env:
          JWT_SECRET: ci_test_secret_minimum_256_bits_long_for_hmac_sha256_algorithm
          JWT_EXPIRATION_MS: 15552000000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: keevo/backend/target/surefire-reports/

      - name: Upload architecture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-reports
          path: |
            keevo/backend/target/spring-modulith-docs/
            keevo/backend/target/modulith-violations.txt
            keevo/backend/target/archunit-violations.txt
          retention-days: 30
