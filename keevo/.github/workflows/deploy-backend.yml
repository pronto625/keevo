name: Deploy Backend

# ─── Trigger ──────────────────────────────────────────────────────────────────
# Fires only on push to the `deploy` branch.
# Tests are expected to have passed in the backend-ci.yml workflow beforehand.
on:
  push:
    branches:
      - deploy

# ─── Concurrency ──────────────────────────────────────────────────────────────
# Cancel any in-progress deploy for the same branch so we always ship the latest.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─── Job 1 : Build & push Docker image to GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Short git SHA  → ghcr.io/.../backend:sha-abc1234
            type=sha,prefix=sha-
            # Always overwrite the `latest` tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GitHub Actions cache (dramatically speeds up re-builds)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2 : Deploy to production server via SSH ────────────────────────────
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Requires manual approval if configured in repo settings

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # These two env vars are forwarded to the remote script by `envs:`.
          # GHCR_PAT must be a GitHub Personal Access Token with `read:packages`.
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          envs: GHCR_PAT,IMAGE_REF,GH_ACTOR
          # ── Remote script ─────────────────────────────────────────────────────
          # Assumptions on the server:
          #   • Docker is installed and running
          #   • /srv/keevo/.env contains production environment variables
          #     (see backend/.env.example for the full list)
          #   • /srv/keevo/firebase-credentials.json is the Firebase service-account key
          script: |
            set -euo pipefail

            echo "→ Authenticating with GHCR…"
            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "→ Pulling new image: ${IMAGE_REF}"
            docker pull "${IMAGE_REF}"

            echo "→ Stopping old container (if running)…"
            docker stop keevo-backend 2>/dev/null || true
            docker rm   keevo-backend 2>/dev/null || true

            echo "→ Starting new container…"
            docker run -d \
              --name keevo-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /srv/keevo/.env \
              -v /srv/keevo/firebase-credentials.json:/app/firebase-credentials.json:ro \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json \
              "${IMAGE_REF}"

            echo "→ Pruning dangling images…"
            docker image prune -f

            echo "✓ Deploy complete."

# ─── Required GitHub Actions Secrets ──────────────────────────────────────────
# Set these in: Settings → Secrets and variables → Actions → Repository secrets
#
#  GHCR_PAT                — Personal Access Token, scope: read:packages
#                            (create at github.com → Settings → Developer settings → PAT)
#
#  DEPLOY_SSH_HOST         — Production server IP or hostname
#  DEPLOY_SSH_USER         — SSH user (e.g. ubuntu, deploy)
#  DEPLOY_SSH_PRIVATE_KEY  — SSH private key (ed25519 preferred)
#                            Paste the full content of ~/.ssh/id_ed25519
#  DEPLOY_SSH_PORT         — SSH port (optional; defaults to 22)
#
# Files required on the server:
#  /srv/keevo/.env                         (copy of .env.example, prod values filled in)
#  /srv/keevo/firebase-credentials.json    (Firebase service-account key)
# ──────────────────────────────────────────────────────────────────────────────
