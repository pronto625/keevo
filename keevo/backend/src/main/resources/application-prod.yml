spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jpa:
    show-sql: false

  security:
    require-ssl: true

logging:
  level:
    root: WARN
    com.keevo: INFO

server:
  tomcat:
    max-threads: 30
    min-spare-threads: 5
    accept-count: 50
