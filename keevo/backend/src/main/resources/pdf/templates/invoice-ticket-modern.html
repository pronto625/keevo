<?xml version="1.0" encoding="UTF-8"?>
<!--
  Story 20.7 — Bref « Ticket moderne » (ticket-modern.ts): dark header band, sans-serif type (the other tickets are
  monospace), coloured status pill, grey totals card, dashed signature boxes. Printed on a 58 / 80 mm roll (page fitted
  to the content) or in a 110 mm column of an A4 sheet. Data only through th:text (escaped).
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<title th:text="${docLabel + ' ' + number}">Facture</title>
<style th:inline="text">
@page { size: [[${a4Sheet ? 'A4 portrait' : pageWidthMm + 'mm ' + pageHeightMm + 'mm'}]]; margin: [[${a4Sheet ? '10mm 0' : '0'}]]; }
.paper { width: [[${contentWidthMm}]]mm; [[${a4Sheet ? 'margin: 0 auto;' : ''}]] }
</style>
<style>
body { margin: 0; font-family: 'Keevo Sans'; font-size: 11px; color: #111827; }
table { border-collapse: collapse; width: 100%; }
td { padding: 0; vertical-align: top; }
.header { background-color: #111827; padding: 18px 16px; text-align: center; }
.shop-logo { height: 44px; max-width: 132px; border-radius: 8px; background-color: #ffffff; margin-bottom: 8px; }
.shop-name { font-size: 15px; font-weight: bold; color: #ffffff; }
.shop-meta { font-size: 9px; color: #b8bcc4; margin-top: 3px; line-height: 1.5; }
.body { padding: 16px; }
.meta-row td { font-size: 10.5px; padding: 2px 0; }
.meta-row td.l { color: #6b7280; padding-right: 6px; }
.meta-row td.v { text-align: right; }
.status-line { text-align: center; margin: 10px 0; }
.status { padding: 4px 14px; border-radius: 10px; font-size: 9.5px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; background-color: #f3f4f6; color: #374151; white-space: nowrap; }
.status-paid { background-color: #dcfce7; color: #166534; }
.status-pending, .status-partial { background-color: #fef9c3; color: #854d0e; }
.status-overdue, .status-cancelled { background-color: #fee2e2; color: #991b1b; }
.status-quote { background-color: #dbeafe; color: #1e40af; }
.divider { border-top: 1px solid #e5e7eb; margin: 10px 0; }
.line { margin-top: 6px; }
.line td { font-size: 11px; }
.line-qty { color: #6b7280; font-weight: bold; width: 1%; white-space: nowrap; padding-right: 6px !important; }
.line-total { font-weight: bold; text-align: right; white-space: nowrap; padding-left: 6px !important; }
.totals-box { background-color: #f9fafb; border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.t-row td { font-size: 10.5px; padding: 2px 0; color: #374151; }
.t-row td.v { text-align: right; white-space: nowrap; }
.t-row.discount td.v { color: #16a34a; }
.t-row.grand td { font-size: 15px; font-weight: bold; color: #111827; border-top: 1px solid #e5e7eb; padding-top: 6px; }
.tone-paid td { color: #166534 !important; }
.tone-strong td { font-weight: bold; }
.tone-void td { color: #991b1b !important; }
.payments { border-top: 1px dashed #d1d5db; margin-top: 6px; padding-top: 6px; }
.mention { font-size: 9px; text-align: center; margin-top: 4px; color: #374151; }
.notes { font-size: 10px; color: #374151; }
.sig-row { margin-top: 14px; border-collapse: separate; border-spacing: 10px 0; }
.sig-row td { width: 50%; text-align: center; border: 1px dashed #d1d5db; border-radius: 6px; padding: 8px; }
.sig-img { max-width: 60px; max-height: 26px; margin-bottom: 4px; }
.sig-placeholder { height: 26px; margin-bottom: 4px; }
.sig-label { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.3px; color: #6b7280; }
.footer { text-align: center; font-size: 9.5px; color: #9ca3af; margin-top: 14px; padding-top: 10px; border-top: 1px solid #e5e7eb; }
.n58 .body { padding: 12px 8px; }
.n58 .line td, .n58 .t-row td, .n58 .meta-row td { font-size: 9px; }
.n58 .t-row.grand td { font-size: 12px; }
</style>
</head>
<body>
<div th:class="${narrow58 ? 'paper n58' : 'paper'}">
  <div class="header">
    <img class="shop-logo" th:if="${logo != null}" th:src="${logo}" alt=""/>
    <div class="shop-name" th:text="${shopName}">Boutique</div>
    <div class="shop-meta"
         th:text="${(shopAddress != null ? shopAddress : '') + (shopPhone != null ? ' · ' + shopPhone : '') + (shopNiu != null ? ' · NIU: ' + shopNiu : '') + (shopRccm != null ? ' · RCCM: ' + shopRccm : '')}">Adresse · Tél.</div>
  </div>

  <div class="body">
    <table class="meta-row"><tr><td class="l" th:text="${docLabel}">Facture</td><td class="v" th:text="${'N° ' + number}">N°</td></tr></table>
    <table class="meta-row"><tr><td class="l">Date</td><td class="v" th:text="${date}">Date</td></tr></table>
    <table class="meta-row"><tr><td class="l">Client</td><td class="v" th:text="${clientName}">Client</td></tr></table>
    <table class="meta-row" th:if="${clientNiu != null}"><tr><td class="l">NIU</td><td class="v" th:text="${clientNiu}">NIU</td></tr></table>
    <table class="meta-row" th:if="${clientRccm != null}"><tr><td class="l">RCCM</td><td class="v" th:text="${clientRccm}">RCCM</td></tr></table>
    <table class="meta-row" th:if="${dueDate != null}"><tr><td class="l">Échéance :</td><td class="v" th:text="${dueDate}">Échéance</td></tr></table>

    <div class="status-line"><span th:class="${'status status-' + statusClass}" th:text="${statusLabel}">Payée</span></div>

    <div class="divider"></div>

    <table class="line" th:each="item : ${items}"><tr>
      <td class="line-qty" th:text="${item.quantity() + '×'}">1×</td>
      <td th:text="${item.name()}">Article</td>
      <td class="line-total" th:text="${item.total()}">0</td>
    </tr></table>

    <div class="totals-box">
      <table class="t-row" th:each="row : ${totalRows}" th:classappend="${row.tone()}"><tr><td th:text="${row.label()}">Sous-total</td><td class="v" th:text="${row.value()}">0</td></tr></table>
      <table class="t-row grand"><tr><td>Total</td><td class="v" th:text="${total}">0</td></tr></table>
      <div class="payments" th:if="${!payments.isEmpty()}">
        <table th:each="row : ${payments}" th:class="${'t-row tone-' + row.tone()}"><tr><td th:text="${row.label()}">Payé</td><td class="v" th:text="${row.value()}">0</td></tr></table>
      </div>
      <div class="mention" th:if="${vatMention != null}" th:text="${vatMention}">TVA non applicable</div>
    </div>

    <table class="meta-row" th:if="${paymentMethod != null}" style="margin-top: 8px;"><tr><td class="l">Moyen de paiement :</td><td class="v" th:text="${paymentMethod}">Espèces</td></tr></table>

    <th:block th:if="${notes != null}"><div class="divider"></div><div class="notes" th:text="${notes}">Notes</div></th:block>

    <table class="sig-row" th:if="${hasSignatures}"><tr>
      <td><img class="sig-img" th:if="${clientSignature != null}" th:src="${clientSignature}" alt=""/><div class="sig-placeholder" th:if="${clientSignature == null}"></div>
        <div class="sig-label">Client</div></td>
      <td><img class="sig-img" th:if="${sellerSignature != null}" th:src="${sellerSignature}" alt=""/><div class="sig-placeholder" th:if="${sellerSignature == null}"></div>
        <div class="sig-label">Vendeur</div></td>
    </tr></table>

    <div class="footer" th:text="${'Merci — ' + shopName}">Merci — Boutique</div>
  </div>
</div>
</body>
</html>
