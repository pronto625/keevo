spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Dev: allow Flyway to create baseline
  flyway:
    baseline-on-migrate: true

logging:
  file:
    name: /tmp/keevo-dev.log
  level:
    root: DEBUG
    com.keevo: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# Story 21.1 — local runs pay on the simulated Mobile Money provider (never MyCoolPay); its webhook secret and signing
# key are fixed dev values (sign a simulated callback with md5(ref + type + amount + currency + operator + private key)).
keevo:
  # Story 21.5 — fake Meta Graph API (nothing reaches Meta), dev-only webhook secrets and encryption key
  whatsapp-cloud:
    graph: ${KEEVO_WHATSAPP_CLOUD_GRAPH:fake}
    app-secret: ${KEEVO_WHATSAPP_CLOUD_APP_SECRET:dev-whatsapp-app-secret}
    verify-token: ${KEEVO_WHATSAPP_CLOUD_VERIFY_TOKEN:dev-whatsapp-verify-token}
  secrets:
    encryption-key: ${KEEVO_SECRETS_ENCRYPTION_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
  payments:
    gateway: ${KEEVO_PAYMENTS_GATEWAY:sandbox}
    mycoolpay:
      private-key: ${MYCOOLPAY_PRIVATE_KEY:sandbox-private-key}
      callback-hash: ${MYCOOLPAY_CALLBACK_HASH:sandbox-callback}
    app-store:
      webhook-secret: ${REVENUECAT_WEBHOOK_SECRET:dev-revenuecat-secret}
      accept-sandbox: true
      revenuecat:
        mode: ${REVENUECAT_MODE:fake}
