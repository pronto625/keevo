# Staging profile — clone of prod, without require-ssl
# Traefik staging may not have a valid TLS cert (FQDN/DNS not yet configured).
# Leaving require-ssl absent lets the app accept HTTP + HTTPS depending on Traefik config.

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jpa:
    show-sql: false
    hibernate:
      # Same rule as prod — Flyway manages schema, Hibernate only validates.
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.keevo: INFO
  # Story 11.1 (MOD-NFR4): one JSON object per console line (Spring Boot native structured
  # logging, logstash layout). Every MDC entry (traceId, tenantId, userId) becomes a root field.
  # Dev/test keep the human-readable pattern — this block lives only in prod/staging.
  structured:
    format:
      console: logstash
    json:
      rename:
        logger_name: logger
        # Brackets are required: without them relaxed binding strips "@" and the rename is a no-op.
        "[@timestamp]": timestamp

server:
  tomcat:
    max-threads: 30
    min-spare-threads: 5
    accept-count: 50
