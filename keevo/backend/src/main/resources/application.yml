spring:
  application:
    name: keevo-backend

  # Load .env file from the working directory (dev convenience — ignored if absent)
  config:
    import: optional:file:.env[.properties]

  # Active profile: dev or prod (override with env var SPRING_PROFILES_ACTIVE)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Story 9-5 — @Scheduled jobs share this pool (default 1 thread): a large global push must not delay
  # the other jobs.
  task:
    scheduling:
      pool:
        size: 4

  # Story 16.14 — every request is French: bean validation messages (VALIDATION_ERROR details) use Hibernate
  # Validator's French bundle whatever Accept-Language the client sends.
  web:
    locale: fr
    locale-resolver: fixed

  # DataSource — values from env vars, with local-dev defaults
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5444}/${POSTGRES_DB:keevo_dev}
    username: ${POSTGRES_USER:keevo}
    password: ${POSTGRES_PASSWORD:keevo_local_pwd}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA — schema is managed by Flyway versioned migrations (db/migration/V{n}__*.sql).
  # ddl-auto=validate ensures Hibernate checks entity↔DB consistency at boot without modifying schema.
  jpa:
    # Disable Open-EntityManager-in-View (OEMIV).
    # With OEMIV enabled, Spring binds an EntityManager (with the caller's TenantContext = "public")
    # to the thread BEFORE our service runs. JpaTransactionManager.doBegin() then REUSES that EM
    # even inside a PROPAGATION_REQUIRES_NEW block, causing multi-tenant subscription queries to
    # run in the wrong schema. Disabling OEMIV ensures every @Transactional method gets a fresh
    # EntityManager that reads the correct TenantContext at session-creation time.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Multipart upload — Story 2.4 CSV import
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # Flyway — Story 10.1: baseline migration for public schema.
  # ddl-auto=validate active since Story 10.2 (no more transition).
  # Public schema only. Tenant schema DDL comes from the per-module Flyway scripts (db/modules/<module>/V*.sql,
  # Story 16.12), applied per tenant by FlywayModuleMigrations (history flyway_history_<module>).
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    default-schema: public
    locations: classpath:db/migration

  # Story 12.4 — Spring Modulith Event Publication Registry (transactional outbox of the
  # after-commit listeners). The table lives in public and is created by Flyway (V28): the tenant
  # connection provider switches search_path, so the registry must always qualify it.
  modulith:
    # spring-modulith-moments comes with the starter and is ON by default: it adds @EnableScheduling
    # (bypassing keevo.scheduling.enabled) and hourly/daily time events nobody consumes. Off.
    moments:
      enabled: false
    events:
      jdbc:
        schema: public
        schema-initialization:
          enabled: false
      # incomplete publications (listener crashed / app stopped before it ran) are replayed at boot
      republish-outstanding-events-on-restart: true
      # completed rows are kept for inspection and purged after 7 days (EventPublicationPurgeJob)
      completion-mode: update

  # Security
  security:
    require-ssl: false  # true in prod

server:
  port: ${APP_PORT:4500}
  servlet:
    context-path: /

# Actuator
management:
  endpoints:
    web:
      exposure:
        # Story 11.2 — prometheus is scraped with a static bearer token (PrometheusScrapeAuthFilter)
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  # Story 11.2 — OpenTelemetry tracing (Micrometer Tracing bridge). The trace id lands in the MDC
  # (traceId) and the X-Request-Id echo. Export is OFF by default: the app needs no collector.
  tracing:
    sampling:
      probability: ${KEEVO_TRACING_SAMPLING_PROBABILITY:0.1}
    # Public clients must not pick the trace id (MDC traceId) nor force sampling: inbound
    # traceparent / B3 headers are NOT consumed (empty list); outbound calls still produce W3C.
    propagation:
      consume: ""
      produce: W3C
  otlp:
    tracing:
      endpoint: ${KEEVO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${KEEVO_OTLP_EXPORT_ENABLED:false}
  # Story 9-5 — client-side percentiles of the HTTP timer, read every 5 min by the health sampler
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99
      # decay window aligned on the 5-minute sample period
      expiry:
        "[http.server.requests]": 5m
      buffer-length:
        "[http.server.requests]": 5

# Keevo custom config
keevo:
  # Story 11.2 — static bearer token for /actuator/prometheus. Unset/blank → the endpoint answers 404.
  observability:
    prometheus-token: ${KEEVO_PROMETHEUS_TOKEN:}
  jwt:
    private-key-path: ${KEEVO_JWT_PRIVATE_KEY_PATH:classpath:keys/private_key.pem}
    public-key-path: ${KEEVO_JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
    # Story 16.11 — short access token renewed silently; refresh token valid 365 days from its last
    # use (sliding); the super-admin dashboard session slides over 12 h.
    access-token-expiry-minutes: ${KEEVO_JWT_ACCESS_TOKEN_EXPIRY_MINUTES:30}
    refresh-token-expiry-days: 365
    super-admin-refresh-expiry-hours: 12
    # Indicative V1 claims (role, tenantStatus, storeId, passwordChangeRequired, onboardingCompleted)
    # for installed V1 apps — never read by the server. Switched off by Story 16.7 once the minimum
    # app version is forced.
    legacy-claims: ${KEEVO_JWT_LEGACY_CLAIMS:true}
  # Story 19.2 — sign-in codes (SMS, WhatsApp, email). Phones outside the allowed dialing prefixes are refused
  # (PHONE_COUNTRY_NOT_SUPPORTED); defaults: Cameroun, Gabon, Tchad, RD Congo, Sénégal. Store-review account: fixed
  # identifier + code (≥ 6 digits), empty = disabled; change both after each review campaign.
  auth:
    otp:
      allowed-phone-prefixes: ${KEEVO_AUTH_ALLOWED_PHONE_PREFIXES:237,241,235,243,221}
      identifier-max-per-10-minutes: 3
      identifier-max-per-hour: 5
      ip-max-per-hour: 10
      verify-per-ip-per-hour: 30
      review-identifier: ${KEEVO_OTP_REVIEW_IDENTIFIER:}
      review-code: ${KEEVO_OTP_REVIEW_CODE:}
    # Story 19.3 — Google / Apple sign-in: ID tokens verified locally against the provider's published keys. Accepted
    # audiences are comma lists (both the Keevo and com.brefpoint.app apps); an empty list disables that provider.
    social:
      ip-max-per-hour: 30
      google:
        client-ids: ${GOOGLE_CLIENT_IDS:}
      apple:
        audiences: ${APPLE_BUNDLE_IDS:}
        bundle-id: ${APPLE_BUNDLE_ID:}   # Bref's single value, used when audiences is empty
  # Story 19.10 — app versions. Public check limited per IP. Legacy-role guard: an auth request without the
  # X-App-Version header comes from the Flutter V1 app, which knows only OWNER / EMPLOYEE: MANAGER / VIEWER
  # memberships are hidden from its login lists and refused at select-tenant / refresh (APP_UPDATE_REQUIRED).
  app-version:
    check:
      ip-max-per-minute: 1200   # per IP — high: many phones share one carrier NAT address
    legacy-role-guard:
      enabled: ${KEEVO_APP_VERSION_LEGACY_ROLE_GUARD:true}
  admin:
    phone: ${ADMIN_PHONE:+237600000000}
    # Story 10.3 (AC2): dev keeps the well-known default Admin@1234! so a local admin is usable.
    # In prod/staging, ProdSecretsValidator rejects this default (and empty/blank) at boot — fail-fast.
    password: ${ADMIN_PASSWORD:Admin@1234!}
  # Story v1s-18-1 — server-side data export
  export:
    sync-row-threshold: 5000      # above: Premium exports run in the background
    page-size: 1000               # keyset page size read from dataset providers
    retention: 24h                # READY files stay downloadable this long
    storage-dir: ${KEEVO_EXPORT_STORAGE_DIR:${java.io.tmpdir}/keevo-exports}
    link-secret: ${KEEVO_EXPORT_LINK_SECRET:}   # blank = random per boot (signed links die on restart)
    max-requests-per-hour: 30
    max-active-jobs: 3
    stale-job-after: 2h
    pdf-max-rows: 2000            # v1s-18-3: data rows a PDF may hold (larger → 422 EXPORT_PDF_TOO_LARGE)
    pdf-max-closures: 31          # v1s-18-3: closures in one « Fin de journée » PDF
  # Story 14.2 — absolute base of the links sent outside the app (invoice links by WhatsApp). Blank = derived from
  # the request (Forwarded / X-Forwarded-* honoured). Prod: https://keevo.ad2s.cm
  public-base-url: ${KEEVO_PUBLIC_BASE_URL:}
  # Story 14.2 — invoice sending: signed public PDF links (secret ≥ 32 chars; blank = the export link secret, both
  # blank = random per boot + WARN, links die on restart) and the per-tenant WhatsApp sending cap.
  invoicing:
    link-secret: ${KEEVO_INVOICE_LINK_SECRET:}
    max-sends-per-hour: 30
  # Story 14.2 — company logo (invoices, export PDF headers). The directory MUST be persistent: only copy.
  company-logo:
    storage-dir: ${KEEVO_COMPANY_LOGO_DIR:${user.home}/keevo-data/company-logos}
    max-bytes: 204800             # 200 KB — the app compresses the logo (600 px) before sending it
    max-dimension: 600            # longest side of the stored logo
  # Story 19.12 — store logos (Bref shop photo). The directory MUST be persistent: only copy.
  store-logo:
    storage-dir: ${KEEVO_STORE_LOGO_DIR:${user.home}/keevo-data/store-logos}
    max-bytes: 204800             # 200 KB
    max-dimension: 600            # longest side of the stored logo
  # Story 20.7 — signatures of documents (client / seller). The directory MUST be persistent: only copy.
  invoice-signature:
    storage-dir: ${KEEVO_INVOICE_SIGNATURE_DIR:${user.home}/keevo-data/invoice-signatures}
    max-bytes: 204800             # 200 KB — stored image, after re-encoding
    max-upload-bytes: 2097152     # 2 MB — raw upload accepted before re-encoding / downscaling
    max-dimension: 800            # longest side of the stored image
  # FR21 — product photo thumbnails, stored server side and synced to every device.
  # The directory MUST be persistent (volume / backed-up disk): it holds the only copy.
  product-photo:
    storage-dir: ${KEEVO_PRODUCT_PHOTO_DIR:${user.home}/keevo-data/product-photos}
    max-bytes: 204800             # 200 KB — the app sends ~40 KB thumbnails (400 px, JPEG 70 %)
    max-dimension: 400            # longest side of the stored thumbnail
  # Story v1s-14-6 (FR7) — « Aide & Tutoriels »: short French videos hosted externally (YouTube…).
  # Blank / non-http(s) url = « Bientôt disponible » in the app. Publish a video by setting its env var.
  help:
    tutorials:
      - id: vendre
        module: Vendre
        title: Enregistrer une vente
        description: Encaisser une vente en quelques secondes, choisir le mode de paiement et annuler une erreur.
        duration-seconds: 120
        url: ${KEEVO_HELP_TUTORIAL_VENDRE_URL:}
      - id: catalogue
        module: Catalogue & stock
        title: Gérer ses produits et son stock
        description: Ajouter un produit, fixer ses prix et suivre les quantités en stock.
        duration-seconds: 120
        url: ${KEEVO_HELP_TUTORIAL_CATALOGUE_URL:}
      - id: inventaire
        module: Inventaire
        title: Faire un inventaire
        description: Compter le stock réel, repérer les écarts et valider l'inventaire.
        duration-seconds: 120
        url: ${KEEVO_HELP_TUTORIAL_INVENTAIRE_URL:}
      - id: rapports
        module: Rapports
        title: Lire ses rapports
        description: Chiffre d'affaires, bénéfices et rapport de fin de journée.
        duration-seconds: 120
        url: ${KEEVO_HELP_TUTORIAL_RAPPORTS_URL:}
      - id: equipe
        module: Équipe
        title: Ajouter et suivre ses employés
        description: Créer un compte employé, l'inviter via WhatsApp et suivre son activité.
        duration-seconds: 120
        url: ${KEEVO_HELP_TUTORIAL_EQUIPE_URL:}
      - id: hors-ligne
        module: Hors ligne & synchro
        title: Travailler sans internet
        description: Vendre hors connexion et comprendre la synchronisation au retour du réseau.
        duration-seconds: 120
        url: ${KEEVO_HELP_TUTORIAL_HORS_LIGNE_URL:}
  fcm:
    enabled: ${KEEVO_FCM_ENABLED:false}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  whatsapp:
    # Providers: noop | wassender | twilio | failover | meta
    # failover = tries Wassender first, falls back to Twilio automatically
    # meta (Story 19.9b) = sign-in codes by the Meta template (bref_point_otp), Wassender then Twilio as fallback and
    #   for every free-text message (Meta free text only works inside the 24-hour window)
    provider: ${KEEVO_WHATSAPP_PROVIDER:noop}
    meta:
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      otp-template: ${WHATSAPP_OTP_TEMPLATE:bref_point_otp}
      # Story 19.9c — platform templates approved by Meta (comma-separated names of docs/whatsapp/modeles-meta-plateforme.md).
      # Only these messages go out as Meta templates (preset meta); every other message stays free text (Wassender/Twilio).
      approved-templates: ${WHATSAPP_APPROVED_TEMPLATES:}
    wassender:
      api-url: ${WASSENDER_API_URL:}
      api-token: ${WASSENDER_API_TOKEN:}
      default-device: ${WASSENDER_DEFAULT_DEVICE:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  # Story 19.9 — SMS / email channels. providers = failover order (comma list: mboasms,infobip / resend,infobip);
  # empty = channel disabled. Keys of each listed provider are required in prod/staging (ProdSecretsValidator).
  sms:
    providers: ${KEEVO_SMS_PROVIDERS:}
    sender-id: ${KEEVO_SMS_SENDER_ID:BrefPoint}
    mboasms:
      base-url: ${MBOASMS_BASE_URL:}
      api-key: ${MBOASMS_API_KEY:}
    infobip:
      base-url: ${INFOBIP_BASE_URL:}
      api-key: ${INFOBIP_API_KEY:}
  email:
    providers: ${KEEVO_EMAIL_PROVIDERS:}
    from: ${KEEVO_EMAIL_FROM:}
    from-name: ${KEEVO_EMAIL_FROM_NAME:}
    resend:
      api-key: ${RESEND_API_KEY:}
    infobip:
      base-url: ${INFOBIP_BASE_URL:}
      api-key: ${INFOBIP_API_KEY:}
  # Story 19.11 — nightly purge of the notification inbox (NotificationRetentionJob, Africa/Douala): rows read more
  # than read-days ago, and every row of a user who is no longer an active member of the tenant. Unread rows are
  # never purged by age.
  notification-retention:
    cron: ${KEEVO_NOTIFICATION_RETENTION_CRON:0 50 3 * * *}
    read-days: ${KEEVO_NOTIFICATION_RETENTION_READ_DAYS:90}
  # Story 19.9 — Expo push (React Native app tokens ExponentPushToken[…]); off by default like FCM, on in prod by env.
  push:
    expo:
      enabled: ${KEEVO_EXPO_PUSH_ENABLED:false}
      access-token: ${EXPO_ACCESS_TOKEN:}
    # Story 19.9b — browser notifications (Web Push, VAPID): Bref's keys, so imported subscriptions stay valid.
    # Missing keys = Web Push disabled (WARN at boot), endpoints still answer.
    web:
      vapid-public-key: ${VAPID_PUBLIC_KEY:}
      vapid-private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:admin@brefpoint.app}
  # Story 21.4 — model of the AI assistant (module ai-assistant). provider: disabled (default: free-text questions
  # answer 503, guided topics and conversations work) | fake (scripted, dev/test profiles only) | anthropic (Claude,
  # official SDK, 21.4.2) | openai | gemini | ollama (OpenAI-compatible chat completions, like Bref's AI_PROVIDER).
  # The key comes from the environment only; anthropic / openai / gemini without a key → disabled with a warning.
  # Model (anthropic: claude-haiku-5-5) and base URL default per provider; timeout-seconds per provider call (1..120).
  ai:
    provider: ${KEEVO_AI_PROVIDER:disabled}
    api-key: ${KEEVO_AI_API_KEY:}
    model: ${KEEVO_AI_MODEL:}
    base-url: ${KEEVO_AI_BASE_URL:}
    timeout-seconds: ${KEEVO_AI_TIMEOUT_SECONDS:45}
    fake-script: ${KEEVO_AI_FAKE_SCRIPT:}
  # Story 21.9 — external MCP server (POST /api/v1/mcp, module mcp-access): requests per minute per personal access
  # token and per company (all its tokens); beyond → 429 RATE_LIMIT_EXCEEDED.
  mcp:
    rate-limit:
      token-per-minute: ${KEEVO_MCP_TOKEN_PER_MINUTE:30}
      tenant-per-minute: ${KEEVO_MCP_TENANT_PER_MINUTE:60}
  # Story 21.1 — self-service plan payment (module payments). gateway: disabled (default: Mobile Money refused with 503,
  # free offers still work) | sandbox (simulated provider, dev/test profiles only) | mycoolpay (every key
  # below required). The webhook URL given to MyCoolPay is <public base>/api/v1/payments/webhook/mycoolpay/<callback-hash>.
  # Story 21.5 — the companies' own WhatsApp Business (module whatsapp-cloud): the Keevo Meta app (embedded signup,
  # one webhook /api/v1/whatsapp/webhook for every company number). graph: disabled | fake (dev/test only) | meta.
  whatsapp-cloud:
    graph: ${KEEVO_WHATSAPP_CLOUD_GRAPH:disabled}
    app-id: ${KEEVO_WHATSAPP_CLOUD_APP_ID:}
    app-secret: ${KEEVO_WHATSAPP_CLOUD_APP_SECRET:}
    verify-token: ${KEEVO_WHATSAPP_CLOUD_VERIFY_TOKEN:}
    graph-url: ${KEEVO_WHATSAPP_CLOUD_GRAPH_URL:https://graph.facebook.com/v21.0}
    # Story 21.6 — the platform number (Bref Point): its messages land in the super-admin inbox, platform WhatsApp
    # campaigns and inbox replies leave from it (needs graph=meta). Defaults to the 19.9b platform number keys.
    platform:
      phone-number-id: ${KEEVO_WHATSAPP_CLOUD_PLATFORM_PHONE_NUMBER_ID:${WHATSAPP_PHONE_NUMBER_ID:}}
      waba-id: ${KEEVO_WHATSAPP_CLOUD_PLATFORM_WABA_ID:${WHATSAPP_BUSINESS_ACCOUNT_ID:}}
      access-token: ${KEEVO_WHATSAPP_CLOUD_PLATFORM_ACCESS_TOKEN:${WHATSAPP_ACCESS_TOKEN:}}
  # Story 21.6 — campaigns (client WhatsApp campaigns and super-admin platform campaigns): dispatcher tick and batch
  # size per campaign and tick (≤ batch-size / tick messages per second per sender number; Meta allows 80/s).
  campaigns:
    tick-ms: ${KEEVO_CAMPAIGNS_TICK_MS:2000}
    batch-size: ${KEEVO_CAMPAIGNS_BATCH_SIZE:40}
  # Story 21.5 (FUS-NFR4) — AES-256-GCM key of the third-party secrets stored by Keevo (base64 of 32 random bytes,
  # e.g. `openssl rand -base64 32`); never in the database. Unset = WhatsApp Business cannot be connected.
  secrets:
    encryption-key: ${KEEVO_SECRETS_ENCRYPTION_KEY:}
  payments:
    gateway: ${KEEVO_PAYMENTS_GATEWAY:disabled}
    initiating-timeout: ${KEEVO_PAYMENTS_INITIATING_TIMEOUT:PT2M}
    pending-timeout: ${KEEVO_PAYMENTS_PENDING_TIMEOUT:PT10M}
    max-checkouts-per-hour: ${KEEVO_PAYMENTS_MAX_CHECKOUTS_PER_HOUR:5}
    mycoolpay:
      base-url: ${MYCOOLPAY_BASE_URL:https://my-coolpay.com}
      public-key: ${MYCOOLPAY_PUBLIC_KEY:}
      private-key: ${MYCOOLPAY_PRIVATE_KEY:}
      callback-hash: ${MYCOOLPAY_CALLBACK_HASH:}
    # Story 21.2 — App Store in-app purchases through RevenueCat (secrets from the environment only)
    app-store:
      webhook-secret: ${REVENUECAT_WEBHOOK_SECRET:}
      accept-sandbox: false
      review-account-email: ${REVIEW_ACCOUNT_EMAIL:}
      revenuecat:
        base-url: ${REVENUECAT_BASE_URL:https://api.revenuecat.com}
        secret-key: ${REVENUECAT_SECRET_KEY:}
        project-id: ${REVENUECAT_PROJECT_ID:}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  packages-to-scan: com.keevo

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.keevo: INFO
