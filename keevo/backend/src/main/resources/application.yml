spring:
  application:
    name: keevo-backend

  # Active profile: dev or prod (override with env var SPRING_PROFILES_ACTIVE)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # DataSource — values from env vars, with local-dev defaults
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5444}/${POSTGRES_DB:keevo_dev}
    username: ${POSTGRES_USER:keevo}
    password: ${POSTGRES_PASSWORD:keevo_local_pwd}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA — tables are created/updated automatically from JPA entity definitions.
  # No SQL migration files needed for the public schema.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway — disabled. Public schema DDL is handled by ddl-auto=update.
  # Tenant schema DDL is handled programmatically by TenantSchemaProvisioner.
  flyway:
    enabled: false

  # Security
  security:
    require-ssl: false  # true in prod

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Keevo custom config
keevo:
  jwt:
    private-key-path: classpath:keys/private_key.pem
    public-key-path: classpath:keys/public_key.pem
    access-token-expiry-hours: 24
    refresh-token-expiry-days: 30

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  packages-to-scan: com.keevo

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.keevo: INFO
