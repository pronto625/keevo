# Test profile (Story v1s-15-11) — activated by PostgresIntegrationTest / FullContextIntegrationTest.
# The DataSource comes from the shared Testcontainers PostgreSQL (@ServiceConnection), never from
# localhost:5444. Quiet logs: the dev profile logs DEBUG to /tmp/keevo-dev.log.
spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      # 8-thread concurrency tests + async listeners must never wait 20 s for a connection.
      # 20 x <= 10 cached contexts stays under the container's max_connections=300.
      maximum-pool-size: 20

logging:
  level:
    root: WARN
    com.keevo: INFO
    org.testcontainers: INFO

# Follow-up review v1s-15-11 (2026-10-13): no real cron tick during tests (SchedulingConfig).
# Full-context tests share one database; jobs are invoked directly by the tests that need them.
keevo:
  scheduling:
    enabled: false
  product-photo:
    storage-dir: ${java.io.tmpdir}/keevo-test-product-photos
  company-logo:
    storage-dir: ${java.io.tmpdir}/keevo-test-company-logos

# Story 12.4 — the shared test database outlives every cached context: a context start must not replay
# the incomplete publications left by other test classes. Replay is covered explicitly
# (EventPublicationRegistryIntegrationTest resubmits through IncompleteEventPublications).
spring.modulith.events.republish-outstanding-events-on-restart: false
