name: keevo
description: Keevo — Gestion d'inventaire et de ventes pour commerçants au Cameroun.
publish_to: 'none'
version: 2.0.16+88

environment:
  sdk: '>=3.8.0 <4.0.0'

# Story 15.4a — Dart pub workspace (Melos 7): this app is the workspace root;
# shared kernel in packages/keevo_core, module packages next to it (15.4c:
# keevo_invoicing). `flutter pub get` here resolves all.
workspace:
  - packages/keevo_core
  - packages/keevo_invoicing

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared kernel (theme, Drift storage, sync, network, common widgets).
  keevo_core:
    path: packages/keevo_core

  # Module packages (Story 15.4c) — registered in
  # lib/core/modules/registered_modules.dart, module code loaded `deferred`.
  keevo_invoicing:
    path: packages/keevo_invoicing

  # State management — Riverpod 3 (Story 15.4b). Newer riverpod_generator /
  # freezed / json_serializable need Dart 3.12+ or an analyzer that
  # flutter_test's pinned `meta` rules out: bump them with the Flutter SDK.
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^14.2.0

  # Local database (SQLCipher — encrypted at rest; CANNOT coexist with sqlite3_flutter_libs)
  drift: ^2.18.0
  sqlcipher_flutter_libs: ^0.5.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # HTTP client
  dio: ^5.7.0
  http: ^1.1.0

  # Code generation (models)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Internationalization & date formatting
  intl: ^0.20.2

  # Phone number input with country picker
  intl_phone_field: ^3.2.0

  # First-launch persistence
  shared_preferences: ^2.3.2

  # File system
  path_provider: ^2.1.3
  path: ^1.9.0

  # Zip of a multi-dataset on-device CSV export (v1s-18-5)
  archive: ^4.0.9

  # Native share sheet (download template, export)
  share_plus: ^10.1.0
  package_info_plus: ^8.3.0

  # Network connectivity detection (v6+ returns List<ConnectivityResult>)
  connectivity_plus: ^6.0.5

  # Client-side UUID v4 generation (Drift has no @UuidGenerator — generate manually)
  uuid: ^4.4.0

  # sqlite3 API needed at runtime to override the dynamic library loader so that
  # drift uses libsqlcipher.so (from sqlcipher_flutter_libs) instead of the
  # default libsqlite3.so that is NOT bundled with sqlcipher_flutter_libs.
  sqlite3: ^2.4.7

  # Image handling (AC3: photo picker and compression)
  image_picker: ^1.0.7
  image: ^4.1.7

  # File picker: CSV import (Story 2.4)
  file_picker: ^10.0.0

  # URL launcher (WhatsApp deeplink, Story 3.4)
  url_launcher: ^6.3.1

  # Firebase Cloud Messaging (Story 8.0 — push notifications)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.10.0
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

  # sqlite3 is now a main dependency — kept here only for the record.
  # sqlite3: ^2.4.7  # moved to dependencies

  # Workspace tooling (run: dart run melos <script>)
  melos: ^7.0.0

  # App icon generation (run: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.3

# Melos 7 reads its config here (workspace root pubspec). Melos is a dev
# dependency, not a global tool: run `dart run melos <command>` from here.
melos:
  # The app (this root package) is a workspace package too.
  useRootAsPackage: true
  scripts:
    generate:
      description: >-
        Code generation, kernel first (Drift database of keevo_core), then the
        app (Riverpod/Freezed/JSON) — the only place this order is written.
        Module packages (keevo_invoicing) have no generated sources yet: one
        that gains some adds its build_runner step here, after keevo_core.
      run: >-
        cd packages/keevo_core
        && dart run build_runner build --delete-conflicting-outputs
        && cd "$MELOS_ROOT_PATH"
        && dart run build_runner build --delete-conflicting-outputs
    analyze:
      description: flutter analyze (lib + test) in each package, one at a time.
      run: dart run melos exec --concurrency 1 -- flutter analyze --no-fatal-infos lib test
    test:
      description: >-
        Tests of each package, one package at a time and one test folder at
        a time (never the whole suite in one run) — tool/test_chunked.sh.
      run: >-
        dart run melos exec --concurrency 1 --fail-fast --dir-exists=test --
        bash "$MELOS_ROOT_PATH/tool/test_chunked.sh"

flutter_launcher_icons:
  android: "ic_launcher"
  min_sdk_android: 21
  image_path: "assets/icon/icon_light.png"
  # iOS: full-bleed opaque square derivative (iOS applies its own mask).
  ios: true
  remove_alpha_ios: true
  image_path_ios: "assets/icon/icon_ios.png"
  web:
    generate: true
    image_path: "assets/icon/icon_light.png"
    background_color: "#0B1E3C"
    theme_color: "#0B1E3C"

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
