name: keevo
description: Keevo — Gestion d'inventaire et de ventes pour commerçants au Cameroun.
publish_to: 'none'
version: 1.1.8-a+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local database (SQLCipher — encrypted at rest; CANNOT coexist with sqlite3_flutter_libs)
  drift: ^2.18.0
  sqlcipher_flutter_libs: ^0.5.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # HTTP client
  dio: ^5.7.0
  http: ^1.1.0

  # Code generation (models)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Internationalization & date formatting
  intl: ^0.20.2

  # Phone number input with country picker
  intl_phone_field: ^3.2.0

  # First-launch persistence
  shared_preferences: ^2.3.2

  # File system
  path_provider: ^2.1.3
  path: ^1.9.0

  # Native share sheet (download template, export)
  share_plus: ^10.1.0

  # Network connectivity detection (v6+ returns List<ConnectivityResult>)
  connectivity_plus: ^6.0.5

  # Client-side UUID v4 generation (Drift has no @UuidGenerator — generate manually)
  uuid: ^4.4.0

  # sqlite3 API needed at runtime to override the dynamic library loader so that
  # drift uses libsqlcipher.so (from sqlcipher_flutter_libs) instead of the
  # default libsqlite3.so that is NOT bundled with sqlcipher_flutter_libs.
  sqlite3: ^2.4.7

  # Image handling (AC3: photo picker and compression)
  image_picker: ^1.0.7
  image: ^4.1.7

  # File picker: CSV import (Story 2.4)
  file_picker: ^10.0.0

  # URL launcher (WhatsApp deeplink, Story 3.4)
  url_launcher: ^6.3.1

  # Firebase Cloud Messaging (Story 8.0 — push notifications)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

  # sqlite3 is now a main dependency — kept here only for the record.
  # sqlite3: ^2.4.7  # moved to dependencies

  # App icon generation (run: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  min_sdk_android: 21
  image_path: "assets/icon/icon_light.png"
  web:
    generate: true
    image_path: "assets/icon/icon_light.png"
    background_color: "#0B1E3C"
    theme_color: "#0B1E3C"

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
