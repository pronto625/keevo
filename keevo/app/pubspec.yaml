name: keevo
description: Keevo — Gestion d'inventaire et de ventes pour commerçants au Cameroun.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local database (SQLCipher — encrypted at rest; CANNOT coexist with sqlite3_flutter_libs)
  drift: ^2.18.0
  sqlcipher_flutter_libs: ^0.5.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # HTTP client
  dio: ^5.7.0

  # Code generation (models)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Phone number input with country picker
  intl_phone_field: ^3.2.0

  # First-launch persistence
  shared_preferences: ^2.3.2

  # File system
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network connectivity detection (v6+ returns List<ConnectivityResult>)
  connectivity_plus: ^6.0.5

  # Client-side UUID v4 generation (Drift has no @UuidGenerator — generate manually)
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

  # SQLite3 library access for Linux desktop test environment
  # (sqlcipher_flutter_libs doesn't ship native libs for desktop — we load system SQLite)
  sqlite3: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
