name: keevo_core
description: Keevo — noyau partagé de l'app (thème, stockage Drift, sync, réseau, widgets communs). Aucune dépendance vers les features ni vers l'app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.8.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3: ^2.4.7
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.0
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.0
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
