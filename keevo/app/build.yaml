targets:
  $default:
    builders:
      riverpod_generator:
        options:
          # Story 15.4b — on purpose: riverpod_generator 3+ strips a trailing
          # "Notifier" from class names (FooNotifier -> fooProvider). The
          # migration keeps every public provider name of Riverpod 2
          # (fooNotifierProvider), so this pattern never matches anything.
          # Removing it renames ~20 providers across lib/ and test/.
          provider_name_strip_pattern: '(?!)'
