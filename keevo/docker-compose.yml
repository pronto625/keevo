version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: keevo_postgres
    ports:
      - "5444:5432"
    environment:
      POSTGRES_DB: keevo_dev
      POSTGRES_USER: keevo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keevo -d keevo_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
