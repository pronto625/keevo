# Keevo — redirect of the old Bref public invoice links (Story 24.10, ADR-10 one-shot cutover)
#
# Template only: nothing in CI applies it. Installed by hand on the day of the cutover, following
# docs/RUNBOOK_BASCULE_BREF.md § « Liens publics Bref » (user action, after the « go »).
#
# What it does: on the old Bref API host, every Bref public link
#   https://api.brefpoint.app/api/v1/invoices/public/<uuid>
# (and the unprefixed variant /v1/invoices/public/<uuid>) answers 302 to the SAME path on Keevo:
#   https://keevo.ad2s.cm/api/v1/invoices/public/<uuid>
# Keevo then resolves the Bref token (public.invoice_legacy_links) and answers 302 to the signed link of the imported
# document (/api/v1/invoices/shared?token=…, the PDF), or a French page « Lien introuvable » / « Lien expiré ».
# Only a UUID matches: /api/v1/invoices/public/count and every other path of the old API are NOT redirected.
#
# Before installing:
#   1. Confirm the Bref API host (BACKEND_DOMAIN in the api-bref prod .env) and replace `api.brefpoint.app` below.
#   2. Either point the DNS record of that host to the Keevo VPS and install these blocks in the Keevo Traefik
#      (traefik:v3.3; single-file provider ~/keevo/traefik/dynamic.yml: merge the router under http.routers and the
#      middleware under http.middlewares IN PLACE, exactly as keevo/backend/docs/DEPLOYMENT_CHECKLIST.md §15 step 3
#      does for staging-router.yml), or install them in the Traefik that serves api-bref today (Traefik v3 syntax:
#      PathRegexp; a Traefik v2 needs, instead, Path(`/api/v1/invoices/public/{token:[0-9a-fA-F-]{36}}`)
#      || Path(`/v1/invoices/public/{token:[0-9a-fA-F-]{36}}`) so both variants stay covered).
#      Plain-http links: the router listens on websecure only; the Keevo Traefik redirects :80 to https globally
#      (deploy-backend.yml `entrypoints.web.http.redirections`) — check the same exists on the Bref Traefik, else add
#      `web` to entryPoints.
#   3. Check the resolver name of the running Traefik (`--certificatesresolvers.<name>.acme…`): `letsencrypt` is the one
#      generated by deploy-backend.yml; change `certResolver` if needed.
#   4. Keep 302 (permanent: false) until Story 25.1: a 301 is cached by browsers and would survive a rollback
#      (Bref turned back on before the « go »). Story 25.1 may switch to 301 once api-bref is retired for good.
#
# Rollback: delete the router and the middleware from the dynamic configuration (single-file provider: write back the
# backup `dynamic.yml.bak-24-10` in place with `cat … >`) — Traefik (providers.file.watch=true) reloads; api-bref,
# turned back on, answers its links again.
# A link carrying a query string (?fbclid=…, ?utm_…) is redirected too; the query is dropped (the token is the path).
http:
  routers:
    bref-legacy-invoice-links:
      rule: "Host(`api.brefpoint.app`) && PathRegexp(`^(/api)?/v1/invoices/public/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - bref-legacy-invoice-redirect
      # never reached: the middleware answers first; Traefik requires a service on every router
      service: noop@internal
      # above any Host-only rule of api-bref (Traefik's default priority = rule length)
      priority: 10000

  middlewares:
    bref-legacy-invoice-redirect:
      redirectRegex:
        regex: "^https?://[^/]+(/api)?/v1/invoices/public/([0-9a-fA-F-]{36})(\\?.*)?$"
        replacement: "https://keevo.ad2s.cm/api/v1/invoices/public/${2}"
        permanent: false
