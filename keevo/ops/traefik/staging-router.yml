# Keevo — staging routers for the PROD Traefik (Story 10-7; admin dashboard added later)
#
# Template only: nothing in CI applies it. It is installed by hand on the VPS, following
# keevo/backend/docs/DEPLOYMENT_CHECKLIST.md § "Staging TLS through the prod Traefik".
#
# The prod Traefik (:80/:443) terminates TLS for staging.api.keevo.cm (ACME, prod cert
# resolver) and proxies to the staging backend container over the shared external Docker
# network `keevo_edge`. The staging stack runs no Traefik and publishes no port.
#
# Router `staging-admin`: the staging admin dashboard (container keevo_staging_dashboard,
# deployed by deploy-staging.yml). Replace `staging.admin.keevo.cm` with the value of the
# ADMIN_STAGING_DOMAIN secret (same host as its DNS record). Upstreams are CONTAINER names,
# never the compose aliases `backend` / `dashboard`, which are ambiguous on keevo_edge.
#
# Before installing, check the resolver name of the running prod Traefik
# (`--certificatesresolvers.<name>.acme…`): `letsencrypt` is the one generated by
# deploy-backend.yml; change `certResolver` below if the live Traefik uses another name.
#
# Rollback: remove these blocks / this file — Traefik (providers.file.watch=true) reloads.
http:
  routers:
    staging:
      rule: "Host(`staging.api.keevo.cm`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: staging
    staging-admin:
      rule: "Host(`staging.admin.keevo.cm`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: staging-admin

  services:
    staging:
      loadBalancer:
        servers:
          - url: "http://keevo_staging_backend:4500"
        healthCheck:
          path: /actuator/health
          interval: 10s
          timeout: 5s
    staging-admin:
      loadBalancer:
        servers:
          - url: "http://keevo_staging_dashboard:3000"
        healthCheck:
          path: /login
          interval: 10s
          timeout: 5s
